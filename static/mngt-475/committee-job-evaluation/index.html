<style id="pal-css">
/* People Analytics Lab — print report (no left rail) */


:root {
  --pal-red: #742d35;
  --pal-navy: #1a1f2b;
  --pal-body: #3a4250;
  --pal-muted: #6b7280;
  --pal-line: #e5e7eb;
  --pal-wash: #f3f4f6;
  --pal-wash-warm: #f7f1f2;
  --pal-ok: #1f6b45;
  --pal-ok-soft: #e7f3ec;
  --pal-warn: #9a6700;
  --pal-friction: #9b3a3a;
  --pal-friction-soft: #f7e8e8;
  --ach: #2563eb;
  --sta: #ca8a04;
  --com: #16a34a;
  --aut: #ea580c;
}

* { box-sizing: border-box; }
html { font-size: 10pt; }

body {
  margin: 0;
  font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--pal-body);
  line-height: 1.4;
  background: #fff;
}

.sheet {
  width: 8.5in;
  min-height: 11in;
  padding: 0.45in 0.55in 0.4in;
  page-break-after: always;
  break-after: page;
  position: relative;
  overflow: hidden;
}

.sheet:last-child {
  page-break-after: auto;
  break-after: auto;
}

/* DRAFT watermark on every page */
.sheet::before {
  content: "DRAFT";
  position: absolute;
  left: 50%;
  top: 45%;
  transform: translate(-50%, -50%) rotate(-32deg);
  font-size: 5.2rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: rgba(116, 45, 53, 0.07);
  z-index: 0;
  pointer-events: none;
  white-space: nowrap;
}

.sheet > * {
  position: relative;
  z-index: 1;
}

/* Top brand header — no accent bars */
.topbar {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding-bottom: 0.3rem;
  margin-bottom: 0.5rem;
  border-bottom: 1px solid var(--pal-line);
}

.topbar .logo {
  width: 40px;
  height: 40px;
  border-radius: 0;
  flex: 0 0 auto;
}

.topbar .brand {
  flex: 1 1 auto;
}

.topbar .brand-name {
  font-size: 1rem;
  font-weight: 700;
  color: #1a202c;
  line-height: 1.2;
}

.topbar .brand-tag {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #822727;
  margin-top: 0.08rem;
}

.topbar .page-meta {
  text-align: right;
  font-size: 1rem;
  color: var(--pal-muted);
  line-height: 1.35;
  flex: 0 0 auto;
}

.kicker {
  margin: 0 0 0.28rem;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--pal-muted);
}

.cover-title {
  margin: 0 0 0.45rem;
  font-size: 1.85rem;
  line-height: 1.12;
  color: var(--pal-navy);
  font-weight: 700;
}

.cover-lead {
  margin: 0 0 0.7rem;
  font-size: 1rem;
  max-width: 48ch;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 0.35rem;
  margin: 0.2rem 0 0.4rem;
}

.meta-cell {
  background: var(--pal-wash);
  border-radius: 8px;
  padding: 0.35rem 0.45rem;
}

.meta-label {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--pal-muted);
}

.meta-value {
  font-size: 1rem;
  font-weight: 600;
  color: var(--pal-navy);
  margin-top: 0.08rem;
}

.sec-head {
  display: flex;
  align-items: flex-start;
  gap: 0.45rem;
  margin-bottom: 0.45rem;
  padding-bottom: 0.28rem;
  border-bottom: 1px solid var(--pal-line);
}

.sec-num {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--pal-red);
  line-height: 1;
}

.sec-head h2 {
  margin: 0;
  font-size: 1.12rem;
  color: var(--pal-navy);
  font-weight: 700;
}

.sec-sub {
  margin: 0.1rem 0 0;
  font-size: 1rem;
  color: var(--pal-muted);
}

h3 {
  margin: 0.5rem 0 0.22rem;
  font-size: 1rem;
  color: var(--pal-navy);
  font-weight: 700;
}

p { margin: 0 0 0.4rem; }
.muted { color: var(--pal-muted); }
.note { font-size: 1rem; color: var(--pal-muted); margin: 0.1rem 0 0.28rem; }
.footer-note {
  margin-top: 0.7rem;
  padding-top: 0.28rem;
  border-top: 1px solid var(--pal-line);
  font-size: 1rem;
  color: var(--pal-muted);
}

.panel, .callout, table, .meta-cell, .viz, .sort-col, .need-row, .type-hero, .keep, .keep-block, .attrition {
  break-inside: avoid;
  page-break-inside: avoid;
}

.keep-block {
  break-inside: avoid;
  page-break-inside: avoid;
}

.panel {
  background: var(--pal-wash);
  border-radius: 9px;
  padding: 0.5rem 0.6rem;
  margin: 0.28rem 0 0.4rem;
}

.panel h3 { margin-top: 0; }

.callout {
  border-left: 4px solid var(--pal-red);
  background: var(--pal-wash);
  border-radius: 0 8px 8px 0;
  padding: 0.4rem 0.55rem;
  margin: 0.3rem 0 0.4rem;
  font-size: 1rem;
}

.callout.warn { border-left-color: var(--pal-warn); background: #fff8e8; }
.callout.ok { border-left-color: var(--pal-ok); background: var(--pal-ok-soft); }
.callout strong { color: var(--pal-navy); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 1rem;
  margin: 0.22rem 0 0.35rem;
}

th, td {
  text-align: left;
  vertical-align: top;
  padding: 0.22rem 0.22rem;
  border-bottom: 1px solid var(--pal-line);
}

th {
  background: var(--pal-wash);
  color: var(--pal-navy);
  font-weight: 700;
  font-size: 1rem;
}

td.num, th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.tag {
  display: inline-block;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 0.05rem 0.26rem;
  border-radius: 999px;
  background: var(--pal-wash-warm);
  color: var(--pal-red);
}

.pill {
  display: inline-block;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 0.08rem 0.28rem;
  border-radius: 999px;
  white-space: nowrap;
}

.pill.hi, .pill.met { background: var(--pal-ok-soft); color: var(--pal-ok); }
.pill.mid, .pill.partial { background: #fff8e8; color: var(--pal-warn); }
.pill.lo, .pill.unmet { background: var(--pal-friction-soft); color: var(--pal-friction); }

ul.bullets { margin: 0.18rem 0 0.28rem; padding-left: 1.05rem; }
ul.bullets li { margin-bottom: 0.2rem; }

ol.refs { padding-left: 1.05rem; font-size: 1rem; margin: 0.12rem 0; }
ol.refs li { margin-bottom: 0.28rem; }

.viz { margin: 0.28rem 0 0.4rem; }
.viz-caption {
  font-size: 1rem;
  color: var(--pal-muted);
  margin: 0.12rem 0 0.28rem;
  font-style: italic;
}

.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  align-items: start;
}

.legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem 0.85rem;
  font-size: 1rem;
  color: var(--pal-muted);
  margin: 0.12rem 0 0.3rem;
}

.legend-row .mark {
  display: inline-block;
  width: 14px;
  height: 2px;
  margin-right: 0.28rem;
  vertical-align: middle;
  background: var(--pal-navy);
}

.legend-row .mark.job {
  background: transparent;
  border-top: 2px dashed var(--pal-red);
  height: 0;
}

/* Thin need lines */
.need-row {
  display: grid;
  grid-template-columns: 5.4rem 1fr 5.2rem;
  gap: 0.35rem;
  align-items: center;
  margin: 0.32rem 0;
  font-size: 1rem;
}

.need-row .label { font-weight: 700; color: var(--pal-navy); }
.need-line { position: relative; height: 22px; }
.need-line .rail-line {
  position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: #d1d5db;
}
.need-line .person-line {
  position: absolute; top: 10px; left: 0; height: 2px; background: var(--pal-navy);
}
.need-line .job-line {
  position: absolute; top: 10px; left: 0; height: 0; border-top: 2px dashed var(--pal-red);
}
.need-line .person-dot {
  position: absolute; top: 5px; width: 10px; height: 10px; border-radius: 50%;
  margin-left: -5px; background: var(--pal-navy);
}
.need-line .job-dot {
  position: absolute; top: 5px; width: 10px; height: 10px; border-radius: 50%;
  margin-left: -5px; background: #fff; border: 2px solid var(--pal-red);
}

.status-flag {
  font-size: 1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  text-align: center;
  padding: 0.22rem 0.28rem;
  border-radius: 6px;
  line-height: 1.2;
}

.status-flag.met { background: var(--pal-ok-soft); color: var(--pal-ok); }
.status-flag.partial { background: #fff8e8; color: var(--pal-warn); }
.status-flag.unmet { background: var(--pal-friction-soft); color: var(--pal-friction); }

.sort-board {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4rem;
  margin: 0.3rem 0 0.4rem;
}

.sort-col {
  border-radius: 10px;
  padding: 0.4rem 0.45rem;
}

.sort-col.supply { background: var(--pal-ok-soft); border: 1px solid #c5e0d0; }
.sort-col.friction { background: var(--pal-friction-soft); border: 1px solid #e5c4c4; }
.sort-col h3 { margin: 0 0 0.12rem; font-size: 1rem; }
.sort-col .sort-sub { font-size: 1rem; color: var(--pal-muted); margin: 0 0 0.35rem; }

.sort-item {
  background: rgba(255,255,255,0.72);
  border-radius: 7px;
  padding: 0.28rem 0.35rem;
  margin-bottom: 0.24rem;
  font-size: 1rem;
  border-left: 3px solid var(--pal-ok);
}

.sort-col.friction .sort-item { border-left-color: var(--pal-friction); }
.sort-item .need-tag {
  display: block;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 0.06rem;
  color: var(--pal-ok);
}
.sort-col.friction .sort-item .need-tag { color: var(--pal-friction); }
.sort-item .elem { font-weight: 600; color: var(--pal-navy); }
.sort-item .why { font-size: 1rem; margin-top: 0.06rem; }

/* Hero type blocks */
.type-hero {
  text-align: center;
  background: var(--pal-navy);
  color: #fff;
  border-radius: 12px;
  padding: 1.1rem 0.8rem 1rem;
  margin: 0.5rem 0 0.65rem;
}

.type-hero .type-kicker {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-bottom: 0.35rem;
}

.type-hero .type-code {
  font-size: 3.4rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  line-height: 1;
  color: #fff;
  margin: 0.15rem 0 0.4rem;
}

.type-hero .type-sub {
  font-size: 1rem;
  color: rgba(255,255,255,0.88);
  max-width: 36ch;
  margin: 0 auto;
  line-height: 1.35;
}

.type-hero.role {
  background: linear-gradient(135deg, var(--pal-navy) 0%, #2a3344 100%);
  border-top: 5px solid var(--pal-red);
}

.type-hero .type-code.words {
  font-size: 2.2rem;
  letter-spacing: 0.06em;
}

.type-hero.compact {
  padding: 0.7rem 0.7rem 0.65rem;
  margin: 0.35rem 0 0.4rem;
}
.type-hero.compact .type-code.words { font-size: 1.85rem; }
.type-hero.compact .type-sub { max-width: 48ch; }

/* Attrition-style contribution board (adds vs contrary) */
.attrition {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.4rem;
  margin: 0.3rem 0 0.35rem;
}
.attrition-col {
  border-radius: 10px;
  padding: 0.4rem 0.45rem;
}
.attrition-col.adds {
  background: var(--pal-ok-soft);
  border: 1px solid #c5e0d0;
}
.attrition-col.contrary {
  background: var(--pal-friction-soft);
  border: 1px solid #e5c4c4;
}
.attrition-col h3 {
  margin: 0 0 0.1rem;
  font-size: 1rem;
}
.attrition-col .attr-sub {
  font-size: 1rem;
  color: var(--pal-muted);
  margin: 0 0 0.3rem;
}
.attr-row {
  display: grid;
  grid-template-columns: 7.2rem 1fr 2.6rem;
  gap: 0.3rem;
  align-items: center;
  margin-bottom: 0.22rem;
  font-size: 1rem;
}
.attr-row .trait { font-weight: 600; color: var(--pal-navy); line-height: 1.2; }
.attr-row .score {
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 700;
  color: var(--pal-navy);
}
.attr-bar-track {
  height: 12px;
  background: rgba(255,255,255,0.65);
  border-radius: 999px;
  overflow: hidden;
}
.attr-bar {
  height: 100%;
  border-radius: 999px;
}
.attrition-col.adds .attr-bar { background: var(--pal-ok); }
.attrition-col.contrary .attr-bar { background: var(--pal-friction); }
.attrition-foot {
  grid-column: 1 / -1;
  text-align: center;
  font-size: 1rem;
  font-weight: 700;
  color: var(--pal-navy);
  padding: 0.22rem 0.4rem;
  background: var(--pal-wash);
  border-radius: 8px;
  margin-top: 0.05rem;
  break-inside: avoid;
  page-break-inside: avoid;
}

svg.chart { display: block; width: 100%; height: auto; }

/* Compact stage / radar captions */
.viz + .viz { margin-top: 0.35rem; }
code { font-size: 0.95em; }

@page {
  size: Letter;
  margin: 0.7in;
}

@media print {
  body { background: #fff; }
  .sheet {
    width: auto;
    min-height: 0;
    height: auto;
    padding: 0;
    overflow: visible;
    page-break-after: always;
    break-after: page;
  }
  .sheet:last-child {
    page-break-after: auto;
    break-after: auto;
  }
}

@media screen {
  body { background: #e8eaee; padding: 1rem 0; }
  .sheet {
    margin: 0 auto 1.1rem;
    background: #fff;
    box-shadow: 0 10px 30px rgba(26, 31, 43, 0.1);
  }
}


/* One-page compact sheet (section 04 orphan fix) */
.sheet-compact {
  padding-top: 0.38in;
  padding-bottom: 0.32in;
}
.sheet-compact .sec-head { margin-bottom: 0.28rem; }
.sheet-compact p { margin-bottom: 0.28rem; }
.sheet-compact table { margin: 0.12rem 0 0.22rem; }
.sheet-compact th, .sheet-compact td { padding: 0.14rem 0.18rem; }
.sheet-compact .attrition {
  margin: 0.18rem 0 0.22rem;
  gap: 0.3rem;
  break-inside: avoid;
  page-break-inside: avoid;
}
.sheet-compact .attrition-col { padding: 0.28rem 0.35rem; }
.sheet-compact .attr-row { margin-bottom: 0.14rem; }
.sheet-compact .attr-bar-track { height: 9px; }
.sheet-compact .attrition-foot { padding: 0.16rem 0.3rem; font-size: 0.95rem; }
.sheet-compact .callout { margin: 0.18rem 0 0; padding: 0.28rem 0.45rem; }
/* Student briefs are not drafts. */

.metric-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:0.35rem; margin:0.35rem 0 0.5rem; }
.metric-card { background:var(--pal-wash); border-radius:9px; padding:0.45rem 0.5rem; }
.metric-card .lbl { font-size:0.85rem; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--pal-muted); }
.metric-card .val { font-size:1.25rem; font-weight:700; color:var(--pal-navy); margin-top:0.15rem; }
.metric-card .sub { font-size:0.9rem; color:var(--pal-muted); margin-top:0.1rem; }
.cover-feedback { margin:0.35rem 0 0.55rem; }
.cover-feedback .sort-item { margin:0.25rem 0; }
.cover-feedback .sort-item.friction { border-left-color: var(--pal-friction); }
.cover-feedback .sort-item.friction .need-tag { color: var(--pal-friction); }

.cover-feedback .sort-item.review .need-tag { color: var(--pal-warn); }
.econ-fig { margin: 0.4rem 0 0.65rem; padding: 0; break-inside: avoid; page-break-inside: avoid; }
.econ-fig-rule { display:block; height:3px; width:100%; background:#742d35; margin:0 0 0.28rem; }
.econ-fig-title { margin:0 0 0.08rem; font-size:1.05rem; font-weight:800; line-height:1.25; color:#1a1f2b; }
.econ-fig-sub { margin:0 0 0.35rem; font-size:0.9rem; line-height:1.3; color:#6b7280; }
.econ-fig-body { margin:0; }
.econ-fig-source { margin:0.28rem 0 0; font-size:0.78rem; line-height:1.3; color:#6b7280; }
.dec-input, .why-input { min-width: 8rem; font: inherit; padding: 0.15rem; background: #fff8e8; border: 1px solid #e5d3a1; border-radius: 4px; }
.print-only { display: none; }
.restore-pre {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.62rem;
  line-height: 1.25;
  white-space: pre-wrap;
  word-break: break-all;
  background: var(--pal-wash);
  border-radius: 8px;
  padding: 0.45rem;
}
.sheet { overflow: visible; }
.sheet.degrees { overflow: visible; }
.structure-line { font-weight: 700; text-decoration: underline; color: var(--pal-navy); margin: 0.35rem 0 0.45rem; }
.factor-block { break-inside: avoid; page-break-inside: avoid; margin: 0.55rem 0 0.7rem; }
.factor-name { font-weight: 700; color: var(--pal-navy); margin: 0 0 0.15rem; font-size: 1.02rem; }
.def-line, .degree-line { margin: 0.08rem 0; overflow-wrap: anywhere; }
.metric-card .val { overflow-wrap: anywhere; }
table.matrix { table-layout: fixed; width: 100%; }
table.matrix th, table.matrix td { overflow-wrap: anywhere; word-break: break-word; }
@page { size: Letter; margin: 0.45in; }

  .no-print { display: none !important; }

    width: 100% !important;

  .col-c6 { display: none !important; }

.wizard-inner {
  width: 8.5in;
  max-width: calc(100% - 1.5rem);
  margin: 0 auto 1.2rem;
}

.btn {
  font: inherit;
  font-weight: 700;
  font-size: 0.95rem;
  background: var(--pal-wash);
  color: var(--pal-navy);
  border: 1px solid #d1d5db;
  border-radius: 6px;
  padding: 0.35rem 0.7rem;
  cursor: pointer;
}
.btn:hover { background: #e5e7eb; }
.btn.primary {
  background: var(--pal-navy);
  color: #fff;
  border-color: var(--pal-navy);
}
.btn.primary:hover { background: #2a3344; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

label.field { display: block; font-weight: 700; color: var(--pal-navy); margin: 0.35rem 0 0.15rem; }
input[type="text"], input[type="number"], textarea, select {
  font: inherit;
  width: 100%;
  padding: 0.35rem 0.45rem;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #fff;
}
textarea { min-height: 4.2rem; }
input.yellow, textarea.yellow { background: #fff8e8; }

.job-grid {
  display: grid;
  grid-template-columns: 1fr 44px 1fr;
  gap: 0.45rem;
  align-items: start;
}
.job-col {
  border: 1px solid var(--pal-line);
  border-radius: 9px;
  background: var(--pal-wash);
  padding: 0.4rem;
  min-height: 14rem;
}
.job-col h3 { margin: 0 0 0.3rem; }
.job-col .pick {
  display: block;
  background: #fff;
  border-radius: 6px;
  padding: 0.28rem 0.35rem;
  margin-bottom: 0.22rem;
  cursor: pointer;
  border: 1px solid transparent;
}
.job-col .pick.sel { border-color: var(--pal-red); background: var(--pal-wash-warm); }
.xfer { display: flex; flex-direction: column; gap: 0.3rem; justify-content: center; padding-top: 2.4rem; }

.factor-nav { display: flex; gap: 0.35rem; flex-wrap: wrap; margin: 0.3rem 0; }

.survey-job {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--pal-navy);
  margin: 0.2rem 0 0.45rem;
}

.structure-line {
  font-weight: 700;
  text-decoration: underline;
  color: var(--pal-navy);
  margin: 0.35rem 0 0.45rem;
}
.factor-block {
  break-inside: avoid;
  page-break-inside: avoid;
  margin: 0.85rem 0 1rem;
}
.factor-name {
  font-weight: 700;
  color: var(--pal-navy);
  margin: 0 0 0.2rem;
  font-size: 1.05rem;
}
.def-line, .degree-line {
  margin: 0.12rem 0;
}
.sheet { overflow: visible; }
.sheet.degrees { overflow: visible; }

.dec-input { min-width: 0; width: 100%; font: inherit; padding: 0.15rem; background: #fff8e8; border: 1px solid #e5d3a1; border-radius: 4px; }
.why-input { min-width: 0; width: 100%; font: inherit; padding: 0.15rem; background: #fff8e8; border: 1px solid #e5d3a1; border-radius: 4px; }

.restore-pre {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 0.62rem;
  line-height: 1.25;
  white-space: pre-wrap;
  word-break: break-all;
  background: var(--pal-wash);
  border-radius: 8px;
  padding: 0.45rem;
  max-height: 9in;
  overflow: hidden;
}

.msg {
  margin: 0.35rem 0;
  padding: 0.4rem 0.55rem;
  border-radius: 8px;
  background: #fff8e8;
  border-left: 4px solid var(--pal-warn);
}
.msg.err { background: var(--pal-friction-soft); border-left-color: var(--pal-friction); }
.msg.ok { background: var(--pal-ok-soft); border-left-color: var(--pal-ok); }

@media (max-width: 900px) {
  .wizard-inner, .sheet { width: auto; }
  .job-grid { grid-template-columns: 1fr; }
  .xfer { flex-direction: row; padding-top: 0; }
}

<script>
/* MNGT 475 committee job-evaluation protocol — browser app */
(function () {
  "use strict";

  var JOBS = [
    "Administrative Assistant",
    "Executive Assistant",
    "Office Manager",
    "Copy Writer",
    "Creative Director",
    "Marketing Director",
    "Software Testing Specialist",
    "Software Engineer",
    "Software Project Manager",
    "Director of Software Development",
    "Customer Service Agent",
    "Director of Customer Service",
    "Market Research Analyst",
    "Director of Market Analysis",
    "Artist Relationship Manager"
  ];

  var KIND = "mngt475-committee-state";
  var MARK_A = "MNGT475STATE";
  var MARK_B = "ENDMNGT475STATE";

  var DEGREE_WORD = ["First", "Second", "Third", "Fourth", "Fifth"];

  var state = blankState();
  var ui = { factorEdit: 1, availSel: null, inSel: null, notice: "", preview: null };

  function blankState() {
    return {
      kind: KIND,
      version: 2,
      structureName: "Administrative",
      selected: [0, 1, 2],
      nRaters: 3,
      factors: [],
      ratings: {},
      decisions: {},
      step: 0,
      curRater: 1,
      curJob: 1,
      finalized: false,
      factorsLocked: false
    };
  }

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function selectedJobs() {
    return state.selected.slice().sort(function (a, b) { return a - b; });
  }
  function nJobs() { return selectedJobs().length; }
  function jobName(idx) { return JOBS[idx]; }
  function degreeEntries(fac) {
    var nA = Number(fac.nAnchors) || 1, out = [], i;
    if (nA === 1) {
      out.push({ code: 0, word: "First", text: fac.a0 });
      out.push({ code: 1, word: "Second", text: fac.a1 });
      return out;
    }
    for (i = 1; i <= nA; i++) {
      out.push({ code: i, word: DEGREE_WORD[i - 1] || String(i), text: fac["a" + i] });
    }
    return out;
  }
  function factorBlockHtml(fac) {
    var entries = degreeEntries(fac), scaleNote, html = "";
    if (Number(fac.nAnchors) === 1) {
      scaleNote = "Scale: 0 = First Degree, 1 = Second Degree.";
    } else {
      scaleNote = "Scale: " + entries.map(function (e) {
        return e.code + " = " + e.word + " Degree";
      }).join("; ") + ".";
    }
    html += '<div class="factor-block">';
    html += '<p class="factor-name">' + esc(fac.label) + "</p>";
    html += '<p class="def-line"><em>Definition:</em> ' + esc(fac.definition) + "</p>";
    html += '<p class="note">' + esc(scaleNote) + "</p>";
    entries.forEach(function (e) {
      html += '<p class="degree-line"><em>' + esc(e.word) + " Degree:</em> " + esc(e.text) + "</p>";
    });
    html += "</div>";
    return html;
  }
  function degreeSheetsHtml(opts) {
    opts = opts || {};
    var meta = opts.meta || "Appendix II · Degree statements";
    var sec = opts.sec || "II";
    var title = opts.title || "Degree statements";
    var foot = opts.foot || "Appendix II · People Analytics Lab of the Bayou · MNGT 475";
    var per = 2, html = "", i, j, jobs = selectedJobs();
    if (!state.factors.length) return "";
    for (i = 0; i < state.factors.length; i += per) {
      html += '<section class="sheet degrees">';
      html += topbar(meta);
      html += '<div class="sec-head"><div class="sec-num">' + sec + "</div><div><h2>" + title + "</h2>" +
        '<p class="sec-sub">Labels, definitions, and degree statements locked for this structure.</p></div></div>';
      if (i === 0) {
        html += '<p class="structure-line">Compensable Factors for Job Structure: ' + esc(state.structureName) + "</p>";
        html += '<p class="note">Jobs in this structure: ' + jobs.map(jobName).map(esc).join(" · ") + "</p>";
      }
      for (j = i; j < Math.min(i + per, state.factors.length); j++) {
        html += factorBlockHtml(state.factors[j]);
      }
      html += '<p class="footer-note">' + foot + "</p>";
      html += "</section>";
    }
    return html;
  }
  function cloneFactors(list) {
    return JSON.parse(JSON.stringify(list));
  }
  function applyExemplar(key) {
    var pack = (typeof EXEMPLAR !== "undefined") ? EXEMPLAR[key] : null;
    if (!pack) return false;
    state.structureName = pack.name;
    state.selected = pack.jobs.slice();
    state.factors = cloneFactors(pack.factors);
    state.ratings = {};
    state.decisions = {};
    state.factorsLocked = false;
    ui.factorEdit = 1;
    return true;
  }
  function payloadSheet() {
    return '<section class="sheet">' +
      topbar("Appendix · Restore payload") +
      '<div class="sec-head"><div class="sec-num">A</div><div><h2>Session data (keep this page)</h2>' +
      '<p class="sec-sub">Required to re-upload this PDF and continue editing. Do not delete.</p></div></div>' +
      '<p class="note">If you print to PDF, this block is extracted when you re-upload the file.</p>' +
      '<pre class="restore-pre">' + esc(wrapPayload(serialize())) + "</pre>" +
      '<p class="footer-note">Appendix · People Analytics Lab of the Bayou · MNGT 475 · no student names</p>' +
      "</section>" +
      "<scr" + "ipt type=\"application/json\" id=\"mngt475-committee-state\">" +
      serialize().replace(/</g, "\\u003c") + "</scr" + "ipt>";
  }
  function renderInstrument() {
    if (!factorsComplete()) {
      $("report").innerHTML = "";
      return;
    }
    var html = "";
    html += '<section class="sheet">';
    html += topbar("Degree statements · MNGT 475");
    html += '<p class="kicker">Appendix II · Degree statements</p>';
    html += '<h1 class="cover-title">' + esc(state.structureName) + "<br/>Locked degree statements</h1>";
    html += '<p class="cover-lead">This is the survey. Raters use only these labels, definitions, and degree statements.</p>';
    html += '<div class="meta-grid">';
    html += '<div class="meta-cell"><div class="meta-label">Structure</div><div class="meta-value">' + esc(state.structureName) + "</div></div>";
    html += '<div class="meta-cell"><div class="meta-label">Jobs</div><div class="meta-value">' + nJobs() + "</div></div>";
    html += '<div class="meta-cell"><div class="meta-label">Factors</div><div class="meta-value">' + state.factors.length + "</div></div>";
    html += '<div class="meta-cell"><div class="meta-label">Status</div><div class="meta-value"><span class="tag">' +
      (state.factorsLocked ? "Locked" : "Draft") + "</span></div></div>";
    html += "</div>";
    html += '<div class="callout"><strong>Lock.</strong> Print / Save as PDF. Re-upload that PDF to keep the same instrument. Unlocking clears ratings.</div>';
    html += "</section>";
    html += degreeSheetsHtml({
      meta: "Appendix II · Degree statements",
      sec: "II",
      title: "Degree statements",
      foot: "Appendix II · People Analytics Lab of the Bayou · MNGT 475"
    });
    html += payloadSheet();
    $("report").innerHTML = html;
  }
  function rk(r, j, f) { return r + "|" + j + "|" + f; }
  function dk(j, f) { return j + "|" + f; }

  function getRating(r, j, f) {
    var v = state.ratings[rk(r, j, f)];
    return (v === 0 || v) ? Number(v) : null;
  }
  function putRating(r, j, f, v) { state.ratings[rk(r, j, f)] = v; }

  function facAnchors(f) { return Number(state.factors[f - 1].nAnchors) || 1; }
  function scaleMin(f) { return facAnchors(f) === 1 ? 0 : 1; }
  function scaleMax(f) { return facAnchors(f) === 1 ? 1 : facAnchors(f); }
  function adi(j, f) {
    var k = state.nRaters, s = 0, n = 0, r, v, m = 0;
    for (r = 1; r <= k; r++) {
      v = getRating(r, j, f);
      if (v == null) return null;
      m += v; n++;
    }
    m /= n;
    for (r = 1; r <= k; r++) s += Math.abs(getRating(r, j, f) - m);
    return s / n;
  }

  function majority(j, f) {
    var k = state.nRaters, thr = Math.floor(k / 2) + 1, best = 0, bestV = null, r, u, v, c;
    for (r = 1; r <= k; r++) {
      v = getRating(r, j, f);
      if (v == null) return { ok: false, unan: false, val: null };
      c = 0;
      for (u = 1; u <= k; u++) if (getRating(u, j, f) === v) c++;
      if (c > best) { best = c; bestV = v; }
    }
    if (best >= thr) return { ok: true, unan: best === k, val: bestV };
    return { ok: false, unan: false, val: null };
  }

  function flagOf(j, f) {
    var m = majority(j, f);
    if (!m.ok) return { code: "MUST", label: "MUST DISCUSS — no majority" };
    if (!m.unan) return { code: "REVIEW", label: "REVIEW — majority, not unanimous" };
    return { code: "OK", label: "OK — unanimous" };
  }

  function iccAk(f) {
    var jobs = selectedJobs(), n = jobs.length, k = state.nRaters, i, r, v, G = 0;
    var x, mJ, mR, ssJ = 0, ssR = 0, ssT = 0, ssE, msJ, msR, msE, sJ, sR, sE;
    if (n < 2 || k < 2) return null;
    x = []; mJ = []; mR = [];
    for (i = 0; i < n; i++) {
      x[i] = [];
      mJ[i] = 0;
      for (r = 1; r <= k; r++) {
        v = getRating(r, jobs[i], f);
        if (v == null) return null;
        x[i][r] = v;
        G += v;
      }
    }
    G /= (n * k);
    for (i = 0; i < n; i++) {
      for (r = 1; r <= k; r++) mJ[i] += x[i][r];
      mJ[i] /= k;
      ssJ += Math.pow(mJ[i] - G, 2);
    }
    ssJ *= k;
    for (r = 1; r <= k; r++) {
      mR[r] = 0;
      for (i = 0; i < n; i++) mR[r] += x[i][r];
      mR[r] /= n;
      ssR += Math.pow(mR[r] - G, 2);
    }
    ssR *= n;
    for (i = 0; i < n; i++) for (r = 1; r <= k; r++) ssT += Math.pow(x[i][r] - G, 2);
    ssE = ssT - ssJ - ssR;
    msJ = ssJ / (n - 1);
    msR = ssR / (k - 1);
    msE = ssE / ((n - 1) * (k - 1));
    if (msE < 0) msE = 0;
    sE = msE;
    sJ = (msJ - msE) / k; if (sJ < 0) sJ = 0;
    sR = (msR - msE) / n; if (sR < 0) sR = 0;
    if (sJ + sR / k + sE / k === 0) return 0;
    return sJ / (sJ + sR / k + sE / k);
  }

      for (i = 0; i < jobs.length; i++) {

      if (!String(fac.label).trim() || !String(fac.definition).trim()) return false;

      if (a < 1 || a > 5) return false;
      if (a === 1) {

  }

    return MARK_A + "\n" + lines.join("\n") + "\n" + MARK_B;

  function parsePayload(text) {
    var t = String(text || "");
    var i = t.indexOf(MARK_A), j = t.indexOf(MARK_B);
    if (i >= 0 && j > i) {
      var raw = t.slice(i + MARK_A.length, j).replace(/\s+/g, "");
      try {
        return JSON.parse(decodeURIComponent(escape(atob(raw))));
      } catch (e1) { /* fall through */ }
    }
    var m = t.match(/\{\s*"kind"\s*:\s*"mngt475-committee-state"[\s\S]*\}\s*$/m);
    if (m) {
      try { return JSON.parse(m[0]); } catch (e2) { /* ignore */ }
    }
    try {
      var obj = JSON.parse(t);
      if (obj && obj.kind === KIND) return obj;
    } catch (e3) { /* ignore */ }
    return null;
  }

      h += '<button class="btn" data-act="back1">Back</button> ';
      if (state.factorsLocked) {
        h += '<button class="btn primary" data-act="showInstrument">Print degree statements</button> ';
        h += '<button class="btn" data-act="unlockFactors">Unlock</button> ';
        h += '<button class="btn primary" data-act="to3">Continue to raters</button></p>';
      } else {
        h += '<button class="btn primary" data-act="lockFactors">Lock and print degree statements</button> ';
        h += '<button class="btn" data-act="to3">Continue without printing</button></p>';
      }
      return h;
    }

    if (state.step === 3) {
      h += topbar("Step 3 of 5 · Raters");
      h += '<div class="sec-head"><div class="sec-num">3</div><div><h2>Committee size</h2>' +
        '<p class="sec-sub">Each rater takes a turn. The next rater does not start until every job is rated.</p></div></div>';
      h += '<label class="field">Number of raters</label>';
      h += '<select id="nRat"><option value="3"' + (state.nRaters === 3 ? " selected" : "") + ">3</option>";
      h += '<option value="4"' + (state.nRaters === 4 ? " selected" : "") + ">4</option></select>";
      h += '<p style="margin-top:0.7rem"><button class="btn" data-act="back2">Back</button> ';
      h += '<button class="btn primary" data-act="to4">Continue</button></p>';
      return h;
    }

    if (state.step === 4) {
      jobs = selectedJobs();
      if (state.curJob > jobs.length) state.curJob = 1;
      idx = jobs[state.curJob - 1];
      h += topbar("Step 4 of 5 · Survey");
      h += '<div class="sec-head"><div class="sec-num">4</div><div><h2>One rater at a time</h2>' +
        '<p class="sec-sub">Rater ' + state.curRater + " of " + state.nRaters +
        " · Job " + state.curJob + " of " + jobs.length + " · " + esc(state.structureName) + "</p></div></div>";
      h += '<div class="survey-job">' + esc(jobName(idx)) + "</div>";
      h += '<p class="note">Other raters wait. Do not fill this screen for someone else. Use the locked degree statements.</p>';
      for (f = 1; f <= state.factors.length; f++) {
        fac = state.factors[f - 1];
        h += "<label class=\"field\">" + esc(fac.label) + " — " + esc(fac.definition) + "</label>";
        h += '<select data-cbo="' + f + '"><option value="">Select a degree</option>';
        degreeEntries(fac).forEach(function (e) {
          h += optionRow(e.code, e.word + " Degree — " + e.text, getRating(state.curRater, idx, f));
        });
        h += "</select>";
      }
      h += '<p style="margin-top:0.7rem"><button class="btn" data-act="back3">Back</button> ';
      h += '<button class="btn primary" data-act="saveNext">Save and next</button></p>';
      return h;
    }

    if (state.step === 5) {
      h += topbar("Step 5 of 5 · Brief");
      h += '<div class="sec-head"><div class="sec-num">5</div><div><h2>Print the committee brief</h2>' +
        '<p class="sec-sub">The cover is the discussion agenda. Print / Save as PDF, or start a new structure.</p></div></div>';
      if (!allRatingsComplete()) {
        h += '<div class="msg err">Ratings are not complete.</div>';
      } else {
        h += '<div class="callout ok">The brief is below. Print / Save as PDF. Re-upload that PDF to continue. Do not type student names.</div>';
      }
      h += '<p><button class="btn primary" data-act="print">Print / Save as PDF</button> ';
      h += '<button class="btn" data-act="newStruct">New structure</button></p>';
      return h;
    }
    return h;
  }

  function optionRow(code, label, current) {
    var sel = current === code ? " selected" : "";
    return '<option value="' + code + '"' + sel + ">" + code + " — " + esc(label) + "</option>";
  }

  function readFactorFields() {
    if (state.step !== 2 || state.factorsLocked) return;
    var fac = state.factors[ui.factorEdit - 1];
    if (!fac) return;
    var lab = $("facLabel"), def = $("facDef"), nA = $("nAnch");
    if (!lab) return;
    fac.label = lab.value;
    fac.definition = def.value;
    fac.nAnchors = Math.max(1, Math.min(5, Number(nA.value) || 1));
    ["a0", "a1", "a2", "a3", "a4", "a5"].forEach(function (k) {
      var el = $(k);
      if (el) fac[k] = el.value;
    });
  }

  function render() {
    ui.notice = ui.notice || "";
    $("wizardBody").innerHTML = wizardStep();
    if (ui.preview === "instrument") renderInstrument();
    else if (state.step === 5) renderReport();
    else $("report").innerHTML = "";
    var file = $("restoreFile");
    if (file) file.addEventListener("change", onRestoreFile);
    var bar = $("barFile");
    if (bar && !bar._bound) {
      bar.addEventListener("change", onRestoreFile);
      bar._bound = true;
    }
    ui.notice = "";
  }

  function onRestoreFile(ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var name = (file.name || "").toLowerCase();
    if (name.slice(-4) === ".pdf") {
      restorePdf(file);
    } else {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var text = String(reader.result || "");
          var obj = null;
          if (/\.html?$/i.test(name) || text.indexOf("<html") >= 0) {
            var doc = new DOMParser().parseFromString(text, "text/html");
            var el = doc.getElementById("mngt475-committee-state");
            if (el) {
              try { obj = JSON.parse(el.textContent); } catch (e0) { obj = null; }
            }
          }
          if (!obj) obj = parsePayload(text);
          if (!obj) throw new Error("No committee session found in that file.");
          applyState(obj);
        } catch (err) {
          ui.notice = "";
          alert(err.message || String(err));
        }
      };
      reader.readAsText(file);
    }
  }

  function restorePdf(file) {
    if (typeof pdfjsLib === "undefined") {
      alert("PDF restore needs a network connection the first time (pdf.js). Keep the appendix page when you print.");
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    var reader = new FileReader();
    reader.onload = function () {
      pdfjsLib.getDocument({ data: new Uint8Array(reader.result) }).promise.then(function (pdf) {
        var parts = [], p = 1;
        function next() {
          if (p > pdf.numPages) {
            var obj = parsePayload(parts.join("\n"));
            if (!obj) throw new Error("Could not extract session data from that PDF. Keep the appendix page when you print.");
            applyState(obj);
            return;
          }
          return pdf.getPage(p).then(function (page) {
            return page.getTextContent().then(function (tc) {
              parts.push(tc.items.map(function (it) { return it.str; }).join(""));
              p += 1;
              return next();
            });
          });
        }
        return next();
      }).catch(function (err) {
        alert(err.message || String(err));
      });
    };
    reader.readAsArrayBuffer(file);
  }

  function loadDemo() {
    state = blankState();
    applyExemplar("Administrative");
    state.nRaters = 3;
    state.factorsLocked = true;
    var cons = EXEMPLAR.Administrative.consensus, job, f, r, deg;
    Object.keys(cons).forEach(function (job) {
      for (f = 1; f <= 4; f++) {
        deg = cons[job][f - 1];
        for (r = 1; r <= 3; r++) putRating(r, Number(job), f, deg);
      }
    });
    putRating(3, 1, 3, 2);
    state.step = 5;
    ui.preview = null;
    ui.notice = "Exemplar Administrative plan (Appendix II). Yellow Appendix IV degrees, except Executive Assistant × Judgment and decision making (2, 3, 3) so the class still sees a Review flag.";
    render();
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    if (state.step === 2) readFactorFields();
    if (act === "start") { state.step = 1; render(); }
    else if (act === "demo") loadDemo();
    else if (act === "addJob") {
      if (state.factorsLocked) return;
      if (ui.availSel == null) return;
      if (state.selected.indexOf(ui.availSel) < 0) state.selected.push(ui.availSel);
      ui.availSel = null;
      render();
    } else if (act === "remJob") {
      if (state.factorsLocked) return;
      if (ui.inSel == null) return;
      state.selected = state.selected.filter(function (x) { return x !== ui.inSel; });
      ui.inSel = null;
      render();
    } else if (act === "adminDef") {
      if (state.factorsLocked) return;
      applyExemplar("Administrative");
      render();
    } else if (act === "mktDef") {
      if (state.factorsLocked) return;
      applyExemplar("Marketing");
      render();
    } else if (act === "swDef") {
      if (state.factorsLocked) return;
      applyExemplar("Software development");
      render();
    } else if (act === "csDef") {
      if (state.factorsLocked) return;
      applyExemplar("Customer Service");
      render();
    } else if (act === "to2") {
      var nm = $("structName");
      if (nm && !state.factorsLocked) state.structureName = nm.value.trim();
      if (!state.structureName) { alert("Name this job structure."); return; }
      if (nJobs() < 2) { alert("A structure needs at least 2 jobs."); return; }
      if (!state.factors.length) {
        var keepSel = state.selected.slice();
        var keepName = state.structureName;
        applyExemplar("Administrative");
        state.selected = keepSel;
        state.structureName = keepName;
      } else {
        ensureFactors(state.factors.length);
      }
      state.step = 2;
      render();
    } else if (act === "applyN") {
      if (state.factorsLocked) return;
      ensureFactors(Number($("nFac").value) || 4);
      ui.factorEdit = 1;
      render();
    } else if (act === "prevFac") {
      if (ui.factorEdit > 1) ui.factorEdit--;
      render();
    } else if (act === "nextFac") {
      if (ui.factorEdit < state.factors.length) ui.factorEdit++;
      render();
    } else if (act === "back1") { ui.preview = null; state.step = 1; render(); }
    else if (act === "lockFactors") {
      if (!factorsComplete()) { alert("Finish label, definition, and degree statements for every factor before locking."); return; }
      state.factorsLocked = true;
      ui.previewFrom = 2;
      ui.preview = "instrument";
      render();
    } else if (act === "showInstrument") {
      if (!factorsComplete()) { alert("Finish label, definition, and degree statements for every factor."); return; }
      state.factorsLocked = true;
      ui.previewFrom = state.step;
      ui.preview = "instrument";
      render();
    } else if (act === "closeInstrument") {
      ui.preview = null;
      if (ui.previewFrom === 5 || allRatingsComplete()) state.step = 5;
      else state.step = 3;
      render();
    } else if (act === "unlockFactors") {
      if (!confirm("Unlock the point plan? Ratings and decisions for this structure will be cleared.")) return;
      state.factorsLocked = false;
      state.ratings = {};
      state.decisions = {};
      ui.preview = null;
      state.step = 2;
      render();
    } else if (act === "to3") {
      if (!factorsComplete()) { alert("Finish label, definition, and degree statements for every factor."); return; }
      state.factorsLocked = true;
      ui.preview = null;
      state.step = 3; render();
    } else if (act === "back2") { ui.preview = null; state.step = 2; render(); }
    else if (act === "to4") {
      state.nRaters = Number($("nRat").value) === 4 ? 4 : 3;
      pruneRatingsToK(state.nRaters);
      if (allRatingsComplete()) { state.step = 5; render(); return; }
      resumeSurveyCursor();
      state.step = 4;
      render();
    } else if (act === "back3") { state.step = 3; render(); }
    else if (act === "saveNext") {
      var jobs = selectedJobs(), idx = jobs[state.curJob - 1], f, sel, ok = true;
      for (f = 1; f <= state.factors.length; f++) {
        sel = document.querySelector('[data-cbo="' + f + '"]');
        if (!sel || sel.value === "") { ok = false; break; }
        putRating(state.curRater, idx, f, Number(sel.value));
      }
      if (!ok) { alert("Rate every compensable factor for this job."); return; }
      if (state.curJob < jobs.length) { state.curJob++; render(); return; }
      if (state.curRater < state.nRaters) {
        alert("Rater " + state.curRater + " is complete. Hand the computer to the next rater.");
        state.curRater++;
        state.curJob = 1;
        render();
        return;
      }
      state.step = 5;
      render();
    }     else if (act === "print") { window.print(); }
    else if (act === "newStruct") {
      if (!confirm("Start a new structure? Print the current brief first if you still need it.")) return;
      state = blankState();
      state.step = 1;
      render();
    }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.hasAttribute("data-avail")) ui.availSel = Number(t.getAttribute("data-avail"));
    if (t.hasAttribute("data-in")) ui.inSel = Number(t.getAttribute("data-in"));
    if (t.id === "nAnch") {
      if (state.factorsLocked) return;
      readFactorFields();
      render();
    }
  });

  window.addEventListener("beforeprint", function () {
    if (ui.preview === "instrument") renderInstrument();
    else if (state.step === 5) renderReport();
  });

  render();
})();

</script>
