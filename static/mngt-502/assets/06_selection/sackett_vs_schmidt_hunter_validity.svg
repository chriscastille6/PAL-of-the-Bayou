<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Selection predictor validity: Schmidt and Hunter 1998 versus Sackett et al. 2022">
  <rect width="1200" height="680" fill="#ffffff"/>
  <text x="48" y="48" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="800" fill="#1a202c">Selection validity: classic vs revised</text>
  <text x="48" y="82" font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#4a5568">Operational validity (Á)  Schmidt &amp; Hunter (1998) vs Sackett et al. (2022)</text>
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="15" fill="#1a202c">
    <!-- legend -->
    <rect x="820" y="40" width="18" height="18" fill="#a0aec0"/>
    <text x="848" y="54" fill="#4a5568">Schmidt &amp; Hunter (1998)</text>
    <rect x="820" y="68" width="18" height="18" fill="#822727"/>
    <text x="848" y="82" fill="#4a5568">Sackett et al. (2022)</text>
  </g>
  <!-- axis -->
  <line x1="320" y1="120" x2="320" y2="600" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="320" y1="600" x2="1100" y2="600" stroke="#cbd5e0" stroke-width="2"/>
  <!-- scale ticks 0 .2 .4 .6 -->
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="13" fill="#718096">
    <text x="312" y="620" text-anchor="end">0</text>
    <text x="580" y="620" text-anchor="middle">.20</text>
    <text x="840" y="620" text-anchor="middle">.40</text>
    <text x="1100" y="620" text-anchor="middle">.60</text>
    <line x1="580" y1="600" x2="580" y2="608" stroke="#cbd5e0"/>
    <line x1="840" y1="600" x2="840" y2="608" stroke="#cbd5e0"/>
    <line x1="1100" y1="600" x2="1100" y2="608" stroke="#cbd5e0"/>
  </g>
  <!-- rows: label, old, new; x = 320 + rho*1300/0.6 = 320 + rho*2166.67 wait: width 780 for 0.6 => 1300 per unit -->
  <!-- scale: 780 px = 0.60 => 1300 px per 1.0 -->
  <g font-family="Source Sans 3, Arial, sans-serif" font-size="16" fill="#1a202c">
    <!-- Structured interview 0.51 / 0.42 -->
    <text x="300" y="158" text-anchor="end">Structured interview</text>
    <rect x="320" y="138" width="663" height="16" fill="#a0aec0"/><!-- .51 -->
    <rect x="320" y="158" width="546" height="16" fill="#822727"/><!-- .42 -->
    <text x="990" y="151" font-size="13" fill="#718096">.51 ’ .42</text>
    <!-- Job knowledge 0.48 / 0.40 -->
    <text x="300" y="214" text-anchor="end">Job knowledge</text>
    <rect x="320" y="194" width="624" height="16" fill="#a0aec0"/>
    <rect x="320" y="214" width="520" height="16" fill="#822727"/>
    <text x="955" y="207" font-size="13" fill="#718096">.48 ’ .40</text>
    <!-- Biodata 0.35 / 0.38 -->
    <text x="300" y="270" text-anchor="end">Biodata (empirical)</text>
    <rect x="320" y="250" width="455" height="16" fill="#a0aec0"/>
    <rect x="320" y="270" width="494" height="16" fill="#822727"/>
    <text x="925" y="263" font-size="13" fill="#718096">.35 ’ .38</text>
    <!-- Work sample 0.54 / 0.33 -->
    <text x="300" y="326" text-anchor="end">Work sample</text>
    <rect x="320" y="306" width="702" height="16" fill="#a0aec0"/>
    <rect x="320" y="326" width="429" height="16" fill="#822727"/>
    <text x="1030" y="319" font-size="13" fill="#718096">.54 ’ .33</text>
    <!-- Cognitive ability 0.51 / 0.31 -->
    <text x="300" y="382" text-anchor="end">Cognitive ability</text>
    <rect x="320" y="362" width="663" height="16" fill="#a0aec0"/>
    <rect x="320" y="382" width="403" height="16" fill="#822727"/>
    <text x="990" y="375" font-size="13" fill="#718096">.51 ’ .31</text>
    <!-- Integrity 0.41 / 0.31 -->
    <text x="300" y="438" text-anchor="end">Integrity test</text>
    <rect x="320" y="418" width="533" height="16" fill="#a0aec0"/>
    <rect x="320" y="438" width="403" height="16" fill="#822727"/>
    <text x="940" y="431" font-size="13" fill="#718096">.41 ’ .31</text>
    <!-- Assessment center 0.37 / 0.29 -->
    <text x="300" y="494" text-anchor="end">Assessment center</text>
    <rect x="320" y="474" width="481" height="16" fill="#a0aec0"/>
    <rect x="320" y="494" width="377" height="16" fill="#822727"/>
    <text x="910" y="487" font-size="13" fill="#718096">.37 ’ .29</text>
    <!-- Unstructured 0.38 / 0.19 -->
    <text x="300" y="550" text-anchor="end">Unstructured interview</text>
    <rect x="320" y="530" width="494" height="16" fill="#a0aec0"/>
    <rect x="320" y="550" width="247" height="16" fill="#822727"/>
    <text x="920" y="543" font-size="13" fill="#718096">.38 ’ .19</text>
  </g>
  <text x="48" y="660" font-family="Source Sans 3, Arial, sans-serif" font-size="12" fill="#718096">Sackett, Zhang, Berry, &amp; Lievens (2022), Journal of Applied Psychology, Table 3. Structured interviews rank #1 after revision.</text>
</svg>
