<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaker notes — HRIS · DEI &amp; EEO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a222d;
    --line: #2d3748;
    --text: #edf2f7;
    --muted: #a0aec0;
    --maroon: #c53030;
    --blue: #63b3ed;
    --ask: #fff5f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Source Sans 3", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "top top"
      "nav main"
      "foot foot";
  }
  header {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 16px 22px;
    border-bottom: 1px solid var(--line); background: #121820;
  }
  header .meta { display: flex; flex-direction: column; gap: 2px; }
  header .kicker {
    font-family: Montserrat, sans-serif;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--maroon); font-weight: 700; margin: 0;
  }
  header h1 {
    font-family: Montserrat, sans-serif;
    font-size: 22px; margin: 0; font-weight: 800;
  }
  header .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  header a, header button, .nav-btn {
    font-family: Montserrat, sans-serif;
    font-size: 13px; font-weight: 700;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 8px;
    padding: 10px 14px; cursor: pointer; text-decoration: none;
  }
  header a:hover, header button:hover, .nav-btn:hover { border-color: var(--maroon); }
  header button.primary { background: var(--maroon); border-color: var(--maroon); }
  .follow {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }
  .follow input { width: 16px; height: 16px; }
  aside {
    grid-area: nav;
    border-right: 1px solid var(--line);
    overflow: auto; padding: 12px;
    background: #121820;
  }
  aside button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: var(--muted); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 4px; cursor: pointer;
    font: 600 14px/1.3 "Source Sans 3", sans-serif;
  }
  aside button:hover { background: var(--panel); color: var(--text); }
  aside button.active {
    background: var(--panel); border-color: var(--maroon); color: var(--text);
  }
  aside button .n {
    font-family: Montserrat, sans-serif;
    font-size: 11px; letter-spacing: .08em; color: var(--blue);
    display: block; margin-bottom: 2px;
  }
  main {
    grid-area: main; padding: 28px 36px 40px; overflow: auto;
    max-width: 920px;
  }
  .slide-label {
    font-family: Montserrat, sans-serif;
    font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--blue); font-weight: 700; margin: 0 0 8px;
  }
  main h2 {
    font-family: Montserrat, sans-serif;
    font-size: 34px; line-height: 1.2; margin: 0 0 16px; font-weight: 800;
  }
  .lo {
    display: inline-block;
    background: var(--maroon); color: #fff;
    font-family: Montserrat, sans-serif;
    font-size: 12px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 6px 10px; border-radius: 6px;
    margin: 0 0 14px;
  }
  .ask {
    background: #2b1a1a; border-left: 5px solid var(--maroon);
    padding: 14px 18px; border-radius: 0 10px 10px 0;
    font-size: 20px; line-height: 1.4; margin: 0 0 22px;
  }
  .ask strong { color: #feb2b2; }
  .notes {
    font-size: 20px; line-height: 1.55; color: var(--text);
    white-space: pre-wrap;
  }
  footer {
    grid-area: foot;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 22px;
    border-top: 1px solid var(--line); background: #121820;
  }
  footer .status { color: var(--muted); font-size: 14px; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-areas: "top" "main" "foot"; }
    aside { display: none; }
  }
</style>
</head>

<script type="application/json" id="notesData">[{"index": 0, "title": "HRIS, DEI, and equal employment", "lo": "", "ask": "", "notes": "Day 4 PDF source of truth. Two blocks: Ch. 3 HRIS then BREAK then Ch. 4 DEI/EEO.\n\nThesis: purchase ≠ adoption; prediction ≠ prescription; speed without Title VII discipline is liability.", "kind": "section"}, {"index": 1, "title": "Agenda", "lo": "", "ask": "", "notes": "Walk once. Chapter 3 (HRIS) → BREAK (PDF p.94) → Chapter 4 (DEI/EEO) → Next module.\n\nSeparate LO slides — never mix 3.x and 4.x. LOs are PDF-verbatim.", "kind": "bullets"}, {"index": 2, "title": "Chapter 3 learning objectives", "lo": "", "ask": "", "notes": "ONE slide — Day 4 PDF Ch. 3 LOs only (3.1–3.6), in order. No Ch. 4 LOs here. Do not invent extras.\n\nRead once; content slides follow.\n\nOptional discuss (not on slide): 3.5 After go-live, who is still on shadow spreadsheets?", "kind": "objectives"}, {"index": 3, "title": "What an HRIS does", "lo": "3.1", "ask": "", "notes": "PDF/Bauer definition. Emphasize the full loop — acquire through distribute — and e-HRM.", "kind": "bullets"}, {"index": 4, "title": "Opportunity — track the employee life cycle", "lo": "3.2", "ask": "", "notes": "Life-cycle data is the opportunity; quality is the constraint.", "kind": "bullets"}, {"index": 5, "title": "Visualizations should be sensegiving", "lo": "3.2", "ask": "What decision does this chart change — or is it decoration?", "notes": "Every chart must change a decision. Else decoration.\n\nVisual = before/after charts only (no title/quote in the image). Click the definition card for Patriotta (2017): tugging readers down a predetermined path / preferred direction — not neutral art.\n\nAsk who must act differently after seeing it.", "kind": "media"}, {"index": 6, "title": "Challenge — cost is time, money, and opportunity", "lo": "3.3", "ask": "", "notes": "Push formal ROI with finance — not a hope chart.", "kind": "bullets"}, {"index": 7, "title": "Framing the pitch", "lo": "3.3", "ask": "What is the minimum amount of cost savings you need to generate for this investment to break even?", "notes": "Work the break-even aloud if time: $11K/quarter × 8 quarters, 10% cost of capital — what savings hurdle?", "kind": "bullets"}, {"index": 8, "title": "Consensus review of HRIS", "lo": "3.3", "ask": "", "notes": "PDF Consensus Review slide. Lean-yes with implementation caveat.\n\nBridge to McCartney & Fu when you hit the sim purchase slide.", "kind": "bullets"}, {"index": 9, "title": "Example of predictive analytics", "lo": "3.3", "ask": "What if we could estimate resignations 1–2 quarters out — how would that change planning?", "notes": "Still LO 3.3 (PDF challenges block) — not 3.6.\n\nProjected resignations/productivity prompts from the PDF.", "kind": "media"}, {"index": 10, "title": "Case study — Microsoft (Slade et al., 2002)", "lo": "3.3", "ask": "", "notes": "Still LO 3.3 (PDF after predictive examples).\n\nTeaching point (on slide as copy, not burned into the figure): people portfolios that changed investment choices — not dashboards for their own sake.\n\nFigure = Slade portfolio chart only (A–D vs investment/retention). Walk Portfolio C vs D: same-or-better net benefit without maxing spend.", "kind": "media"}, {"index": 11, "title": "80/20 rule of HR data", "lo": "3.4", "ask": "", "notes": "Most time is cleaning/joining. Set expectations before Exam 1 data work.", "kind": "bullets"}, {"index": 12, "title": "Common HRIS / HCM tools", "lo": "3.4", "ask": "", "notes": "Logo strip = illustrative market examples only — not endorsements, not a preferred vendor list.\n\nDay 4 PDF does not name a vendor strip (Oracle appears as an ERP link; Lightcast as a SaaS example). These are common platforms students will see in RFPs/demos: Workday, SAP, Oracle, ADP, UKG, BambooHR, Dayforce.\n\nBridge: next slide is Purchasing — fit to needs + SHRM reading, not logo fame.", "kind": "bullets"}, {"index": 13, "title": "Purchasing an HRIS", "lo": "3.4", "ask": "If you pitch your CFO for ≥10% ROI, what three proofs do you bring?", "notes": "Point to SHRM vendor article on Canvas + checklist questions.\n\nCFO pitch: ≥10% ROI proofs.", "kind": "bullets"}, {"index": 14, "title": "Sim purchase — and what practice actually buys", "lo": "3.4", "ask": "", "notes": "PDF places this with purchasing (LO 3.4), before implementation.\n\nSim: morale up, grievances down. Practice benefits from McCartney & Fu.", "kind": "media"}, {"index": 15, "title": "Developing an HRIS", "lo": "3.4", "ask": "", "notes": "Keep LO 3.4 visible in your head — do not lecture past it.\n\nFrame: Five decision steps before the license key matters.", "kind": "bullets"}, {"index": 16, "title": "HRIS decision steps", "lo": "3.4", "ask": "", "notes": "Keep LO 3.4 visible in your head — do not lecture past it.\n\nFrame: Assess → needs → platforms → design → vendor (Bauer Fig. 3.8).", "kind": "visual"}, {"index": 17, "title": "How performance data reaches the employee file", "lo": "3.4", "ask": "Where does the rating live after the conversation ends?", "notes": "Open with: Where does the rating live after the conversation ends?\n\nKeep LO 3.4 visible in your head — do not lecture past it.\n\nFrame: Data flow excerpt: rate employees → HR review → update employee file (Bauer Fig. 3.9).", "kind": "visual"}, {"index": 18, "title": "Change is the real implementation work", "lo": "3.5", "ask": "Who still keeps the real headcount in Excel — and why?", "notes": "Shadow spreadsheets = failed HRIS.\n\nSim purchase is a people+process bet.", "kind": "media"}, {"index": 19, "title": "Psychology of change", "lo": "3.5", "ask": "", "notes": "Name the barrier before picking the fix.", "kind": "media"}, {"index": 20, "title": "Psychology of change — interventions", "lo": "3.5", "ask": "", "notes": "Match intervention to barrier — don’t default to “more training.”", "kind": "media"}, {"index": 21, "title": "Focus on the bright spots", "lo": "3.5", "ask": "", "notes": "Scale pockets that already work — deficit lectures rarely move adoption.\n\nNext: LO 3.6 Getting Technical (databases), then BREAK.", "kind": "visual"}, {"index": 22, "title": "Getting technical — core IS concepts", "lo": "3.6", "ask": "", "notes": "LO 3.6 from PDF — database / DBMS / relational concepts.\n\nStyle E sparse: one slide stands in for the PDF’s 10-page technical block.\n\nNext slide is BREAK — then Chapter 4 LOs.", "kind": "bullets"}, {"index": 23, "title": "One flat employee table", "lo": "3.6", "ask": "", "notes": "Keep LO 3.6 visible in your head — do not lecture past it.\n\nFrame: A single table holds employee rows — useful, but joins unlock more (Bauer Table 3.1).", "kind": "visual"}, {"index": 24, "title": "Key variables link tables", "lo": "3.6", "ask": "", "notes": "Keep LO 3.6 visible in your head — do not lecture past it.\n\nFrame: EmployeeID joins people data to invoice data — no redundant copies (Bauer Fig. 3.12).", "kind": "visual"}, {"index": 25, "title": "Forms maintain the record", "lo": "3.6", "ask": "", "notes": "Keep LO 3.6 visible in your head — do not lecture past it.\n\nFrame: User-facing form writes the same row the table stores (Bauer Fig. 3.13).", "kind": "visual"}, {"index": 26, "title": "Queries ask the database", "lo": "3.6", "ask": "", "notes": "Keep LO 3.6 visible in your head — do not lecture past it.\n\nFrame: SQL turns stored columns into answers — e.g., an average (Bauer Fig. 3.14).", "kind": "visual"}, {"index": 27, "title": "Reports turn answers into decisions", "lo": "3.6", "ask": "", "notes": "Keep LO 3.6 visible in your head — do not lecture past it.\n\nFrame: Same data, formatted for managers — sales by salesperson (Bauer Fig. 3.15).", "kind": "visual"}, {"index": 28, "title": "BREAK", "lo": "", "ask": "", "notes": "Hard stop — matches Day 4 PDF Break page between Ch. 3 and Ch. 4.\n\nClock: 5–10 minutes.\n\nAfter break: Chapter 4 learning objectives (4.1–4.5 only).", "kind": "section"}, {"index": 29, "title": "Chapter 4 learning objectives", "lo": "", "ask": "", "notes": "ONE slide — Day 4 PDF Ch. 4 LOs only (4.1–4.5), in order. No Ch. 3 LOs here. Do not invent extras.\n\nRead once; DEI/EEO content follows.\n\nOptional discuss (not on slide):\n• 4.3 Treatment or impact before we “fix” the process?\n• 4.5 Which compliance precaution is missing locally?", "kind": "objectives"}, {"index": 30, "title": "Why DEI management matters", "lo": "4.1", "ask": "", "notes": "Equity vs inclusion vocabulary. Lack of diversity has organizational costs.", "kind": "bullets"}, {"index": 31, "title": "EEO infrastructure", "lo": "4.2", "ask": "", "notes": "EEOC vs OFCCP — who investigates what before redesign talk.", "kind": "bullets"}, {"index": 32, "title": "Title VII — the core statute", "lo": "4.3", "ask": "", "notes": "PDF Title VII opener (relief/damages). Bridge into treatment vs impact.", "kind": "bullets"}, {"index": 33, "title": "Discrimination under Title VII", "lo": "4.3", "ask": "Treatment or impact — which path before you redesign?", "notes": "PDF wording: disparate treatment vs disparate impact.\n\nStay with Bauer Day 4 framing — no CourtListener detour tonight.", "kind": "media"}, {"index": 34, "title": "Disparate impact — UGESP and 4/5ths", "lo": "4.3", "ask": "", "notes": "Walk UGESP → 4/5ths → job-relatedness/business necessity → alternatives.\n\n4/5ths is a rule of thumb, not the whole law.", "kind": "media"}, {"index": 35, "title": "Warm-up — is there adverse impact?", "lo": "4.3", "ask": "What information do you need from the vendor before you buy the tool?", "notes": "Vendor info request before tool buy — selection rates first.", "kind": "compare"}, {"index": 36, "title": "Calculator on AdverseImpact.org", "lo": "4.3", "ask": "", "notes": "Open adverseimpact.org once together. Slow is fine.\n\nSeparate “flag for review” from “guilty.”", "kind": "bullets"}, {"index": 37, "title": "Potentially illegal interview questions", "lo": "4.3", "ask": "", "notes": "Exam 1 checklist from Manager’s Toolbox.\n\nHave them strike one question they’d still hear locally.", "kind": "visual"}, {"index": 38, "title": "Additional acts beyond Title VII", "lo": "4.4", "ask": "", "notes": "PDA/PWFA, ADEA, ADA, GINA, Ledbetter, military — skim the map; depth on Exam 1 as needed.", "kind": "bullets"}, {"index": 39, "title": "DEI in the age of HR analytics", "lo": "4.5", "ask": "", "notes": "PDF: affirmative action myths + analytics pathway.\n\nAnalytics can surface gaps or bake bias.", "kind": "bullets"}, {"index": 40, "title": "How to comply with EEO regulations", "lo": "4.5", "ask": "", "notes": "PDF compliance slide: training, policies, documentation.\n\nHelping stance — capacity, not fear-mongering.", "kind": "bullets"}, {"index": 41, "title": "Next module", "lo": "", "ask": "", "notes": "PDF close: Ch. 5 & 6. Hand off to job analysis / work design.", "kind": "section"}]</script>
<script>
(function () {
  const slides = JSON.parse(document.getElementById("notesData").textContent);
  const slug = document.body.dataset.deckSlug;
  let channel = null;
  try { channel = new BroadcastChannel("mngt502-notes-" + slug); } catch (e) {}
  let idx = 0;

  const els = {
    toc: document.getElementById("toc"),
    label: document.getElementById("slideLabel"),
    title: document.getElementById("slideTitle"),
    lo: document.getElementById("loBadge"),
    ask: document.getElementById("askBlock"),
    notes: document.getElementById("notesBody"),
    status: document.getElementById("syncStatus"),
    follow: document.getElementById("followDeck"),
  };

  slides.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="n">SLIDE ${String(i + 1).padStart(2, "0")}</span>${s.title}`;
    b.addEventListener("click", () => show(i, true));
    els.toc.appendChild(b);
  });

  function publish(index) {
    const msg = { type: "slide", index: index, source: "notes", slug: slug };
    try { channel && channel.postMessage(msg); } catch (e) {}
    try {
      if (window.opener && !window.opener.closed) window.opener.postMessage(msg, "*");
    } catch (e) {}
  }

  function show(i, broadcast) {
    idx = Math.max(0, Math.min(i, slides.length - 1));
    const s = slides[idx];
    els.label.textContent = `Slide ${idx + 1} / ${slides.length}`;
    els.title.textContent = s.title;
    if (s.lo) {
      els.lo.hidden = false;
      els.lo.className = "lo";
      els.lo.textContent = "LO " + s.lo;
    } else {
      els.lo.hidden = true;
    }
    if (s.ask) {
      els.ask.hidden = false;
      els.ask.innerHTML = "<strong>Discuss:</strong> " + s.ask.replace(/</g, "&lt;");
    } else {
      els.ask.hidden = true;
    }
    els.notes.textContent = s.notes || "(No notes for this slide.)";
    [...els.toc.children].forEach((btn, j) => btn.classList.toggle("active", j === idx));
    history.replaceState(null, "", "#s" + (idx + 1));
    if (broadcast) {
      publish(idx);
      els.status.textContent = "Advanced from notes window";
    }
  }

  function applyRemote(data) {
    if (!data || typeof data !== "object") return;
    if (data.slug && data.slug !== slug) return;
    if (data.type !== "slide" || data.source === "notes") return;
    if (!els.follow.checked) {
      els.status.textContent = "Deck moved (follow off) — now on slide " + (data.index + 1);
      return;
    }
    if (typeof data.index === "number" && data.index !== idx) {
      show(data.index, false);
    }
    els.status.textContent = "Synced from deck · slide " + ((data.index ?? idx) + 1);
  }

  if (channel) channel.onmessage = (ev) => applyRemote(ev.data);
  window.addEventListener("message", (ev) => applyRemote(ev.data));

  document.getElementById("prevBtn").addEventListener("click", () => show(idx - 1, true));
  document.getElementById("nextBtn").addEventListener("click", () => show(idx + 1, true));
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const s = slides[idx];
    const text = `Slide ${idx + 1}: ${s.title}\n\n` +
      (s.lo ? `LO ${s.lo}\n` : "") +
      (s.ask ? `Discuss: ${s.ask}\n\n` : "\n") +
      (s.notes || "");
    try {
      await navigator.clipboard.writeText(text);
      els.status.textContent = "Copied this slide’s notes";
    } catch (e) {
      els.status.textContent = "Copy failed — select text manually";
    }
  });

  window.addEventListener("keydown", (e) => {
    if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
      e.preventDefault(); show(idx + 1, true);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); show(idx - 1, true);
    } else if (e.key === "Home") { e.preventDefault(); show(0, true); }
    else if (e.key === "End") { e.preventDefault(); show(slides.length - 1, true); }
  });

  const m = location.hash.match(/^#s(\d+)$/);
  show(m ? parseInt(m[1], 10) - 1 : 0, false);
  els.status.textContent = "Ready — open the deck and advance; notes will follow";
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: "notes-ready", source: "notes", slug: slug }, "*");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
