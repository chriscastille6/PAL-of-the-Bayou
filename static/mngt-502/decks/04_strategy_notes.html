<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a222d;
    --line: #2d3748;
    --text: #edf2f7;
    --muted: #a0aec0;
    --maroon: #c53030;
    --blue: #63b3ed;
    --ask: #fff5f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Source Sans 3", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "top top"
      "nav main"
      "foot foot";
  }
  header {
    grid-area: top;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 16px 22px;
    border-bottom: 1px solid var(--line); background: #121820;
  }
  header .meta { display: flex; flex-direction: column; gap: 2px; }
  header .kicker {
    font-family: Montserrat, sans-serif;
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--maroon); font-weight: 700; margin: 0;
  }
  header h1 {
    font-family: Montserrat, sans-serif;
    font-size: 22px; margin: 0; font-weight: 800;
  }
  header .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  header a, header button, .nav-btn {
    font-family: Montserrat, sans-serif;
    font-size: 13px; font-weight: 700;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); border-radius: 8px;
    padding: 10px 14px; cursor: pointer; text-decoration: none;
  }
  header a:hover, header button:hover, .nav-btn:hover { border-color: var(--maroon); }
  header button.primary { background: var(--maroon); border-color: var(--maroon); }
  .follow {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--muted);
  }
  .follow input { width: 16px; height: 16px; }
  aside {
    grid-area: nav;
    border-right: 1px solid var(--line);
    overflow: auto; padding: 12px;
    background: #121820;
  }
  aside button {
    display: block; width: 100%; text-align: left;
    background: transparent; border: 1px solid transparent;
    color: var(--muted); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 4px; cursor: pointer;
    font: 600 14px/1.3 "Source Sans 3", sans-serif;
  }
  aside button:hover { background: var(--panel); color: var(--text); }
  aside button.active {
    background: var(--panel); border-color: var(--maroon); color: var(--text);
  }
  aside button .n {
    font-family: Montserrat, sans-serif;
    font-size: 11px; letter-spacing: .08em; color: var(--blue);
    display: block; margin-bottom: 2px;
  }
  main {
    grid-area: main; padding: 28px 36px 40px; overflow: auto;
    max-width: 920px;
  }
  .slide-label {
    font-family: Montserrat, sans-serif;
    font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--blue); font-weight: 700; margin: 0 0 8px;
  }
  main h2 {
    font-family: Montserrat, sans-serif;
    font-size: 34px; line-height: 1.2; margin: 0 0 16px; font-weight: 800;
  }
  .lo {
    display: inline-block;
    background: var(--maroon); color: #fff;
    font-family: Montserrat, sans-serif;
    font-size: 12px; font-weight: 800; letter-spacing: .08em;
    text-transform: uppercase; padding: 6px 10px; border-radius: 6px;
    margin: 0 0 14px;
  }
  .ask {
    background: #2b1a1a; border-left: 5px solid var(--maroon);
    padding: 14px 18px; border-radius: 0 10px 10px 0;
    font-size: 20px; line-height: 1.4; margin: 0 0 22px;
  }
  .ask strong { color: #feb2b2; }
  .notes {
    font-size: 20px; line-height: 1.55; color: var(--text);
    white-space: pre-wrap;
  }
  footer {
    grid-area: foot;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 22px;
    border-top: 1px solid var(--line); background: #121820;
  }
  footer .status { color: var(--muted); font-size: 14px; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-areas: "top" "main" "foot"; }
    aside { display: none; }
  }
</style>

<body data-deck-slug="04_strategy">
<header>
  <div class="meta">
    <p class="kicker">MNGT 502 Managing Human Capital · 3 · speaker notes</p>

<script type="application/json" id="notesData">[{"index": 0, "title": "HR strategy and costing", "lo": "", "ask": "", "notes": "Module 3 opener. Thesis: goals + budget constraints first, then architect HR.\n\nPreview: Delta/Levenson → MBO → SMART/budget+penalty → lean HCROI → finance/Pizza/ROI → HPWP bundles → total rewards → UA close.", "kind": "section"}, {"index": 1, "title": "Agenda", "lo": "", "ask": "", "notes": "Walk once. Process note in the lede: financial tools + ROI vs long-term people investment.\n\nOrder locked: LOs → Delta/Levenson → MBO → SMART share → budget audit → budget+penalty → LAMP/visibility → lean turnover/absenteeism → finance → Pizza Shop → program ROI → HPWP/fit → total rewards → UA → close.\n\nFinance sits after cost visibility and before Pizza Shop so vocabulary is ready for the hurdle-rate exercise and ROI tool.", "kind": "bullets"}, {"index": 2, "title": "Learning objectives", "lo": "", "ask": "", "notes": "Official Module 3 LOs only (instructor PDF) — M3.1–M3.4 on one slide.\n\nDiscuss (not on slide):\n• M3.1 What people cost does your CFO watch vs ignore?\n• M3.2 When is a rough NPV spreadsheet still useful?\n• M3.3 Same industry, different people bundles — why?\n• M3.4 When is utility analysis the right conversation tool?", "kind": "objectives"}, {"index": 3, "title": "Warm-up — Delta in the 1990s", "lo": "", "ask": "", "notes": "Visual-only opener (Wright 2008 case figure). Chris narrates; students look — no pick/vote/raise-hands on this slide.\n\nSet context from the lede: low-cost carriers (Southwest, AirTran); high labor costs; profitability pressure. Discussion and the cost-control path come on the next slides.", "kind": "visual"}, {"index": 4, "title": "Delta’s cost-control model", "lo": "", "ask": "", "notes": "Wright (2008) Figure 2 / Leadership 7.5 path: layoffs · low wages · low training · contractors → commodity / contingent / temporary / low-tenure workforce → competitive low-cost travel → revenues/costs/profits.\n\nNow walk the room through the diagram; this is where discussion starts.", "kind": "visual"}, {"index": 5, "title": "Unintended consequences", "lo": "", "ask": "", "notes": "Same Wright figure with unintended consequences box: low on-time performance, customer complaints, baggage handling problems, safety problems — feeding costs.\n\nBridge line: short-term ROI levers can raise costs they were meant to cut.", "kind": "visual"}, {"index": 6, "title": "Chasing returns can be counterproductive", "lo": "", "ask": "", "notes": "Original Levenson (2015) slide visual (PDF p.6). Narrate ROI vs competitive advantage; cash-flow analyses rest on assumptions that are often guesses.\n\nCallout on the figure: “This is your HR budget!” on the capability side.\n\nOptional later (not a vote on this slide): where is their draft sim budget on this continuum?", "kind": "compare"}, {"index": 7, "title": "Management by objectives (MBO)", "lo": "", "ask": "", "notes": "Definition from PDF: define org goals; ensure all parts act aligned with goals and business strategy.\n\nRaise alignment / measuring alignment / monitoring alignment.\n\nKPIs/OKRs = same wine, new bottle.", "kind": "bullets"}, {"index": 8, "title": "Cascading of objectives", "lo": "", "ask": "", "notes": "Visual: org → division → department → individual.\n\nAsk where alignment usually breaks in their workplaces.", "kind": "visual"}, {"index": 9, "title": "How effective is MBO?", "lo": "", "ask": "", "notes": "Rodgers & Hunter (1991) from PDF: 70 studies; ~56% average productivity gain with leadership commitment; r≈.67; ~45% variance; 68/70 showed gains.\n\nAsk what happened in the two that did not — usually commitment/implementation.", "kind": "media"}, {"index": 10, "title": "The knowing–doing gap", "lo": "", "ask": "", "notes": "Pfeffer & Sutton (2000) from PDF — knowing ≠ doing.\n\nDrivers on PDF: fear, internal competition, talk over action, culture.\n\nBridge: MBO evidence is strong; execution is the gap.", "kind": "media"}, {"index": 11, "title": "Exercise — share 3–5 SMART goals", "lo": "", "ask": "What 3–5 SMART goals will your team prioritize?", "notes": "TIMEBOX: ~8–10 min team huddle + ~8–10 min class share.\n\nSMART on slide from PDF: Specific, Measurable, Achievable, Relevant, Time-bound.\n\nEach team shares 3–5 goals only — not the full “how.” Circulate; listen for conflicting goals (e.g., both productivity and unit labor cost as primary — PDF flags that as a bad pair).", "kind": "bullets"}, {"index": 12, "title": "Which is a SMART strategic goal?", "lo": "", "ask": "Which option is a SMART strategic goal — and why are the others means, not goals?", "notes": "Clicker/show of hands. Correct = E (unit labor costs to $56 by end of Year 2).\n\nA–D are decisions/priorities, not SMART strategic goals.", "kind": "bullets"}, {"index": 13, "title": "Goal setting for the sim", "lo": "", "ask": "", "notes": "Require Year 1 and Year 2 goals (staging).\n\nSay clearly: the HOW / tactics stay private for now — inside the team only.\n\nCoherent strategy = tactics fit across years even if Year-1 and Year-2 moves differ.", "kind": "bullets"}, {"index": 14, "title": "Exercise — budget allocation audit", "lo": "", "ask": "Do your budget allocations align with the goals you just shared?", "notes": "After SMART share: open Budget Allocation worksheet.\n\nCIRCULATE: Are plans/allocations aligned with the goals they just voiced? After hearing classmates, do they need to revise?\n\nLanguage from PDF: external congruence (sim priorities) + internal consistency (bundles complement). Avoid quarter-to-quarter play.", "kind": "media"}, {"index": 15, "title": "Year 1 budget & the overage penalty", "lo": "", "ask": "", "notes": "From Module 3 PDF p.31 — land hard; this is a graded constraint.\n\nYear 1 budget $1.4M; quarterly $350K.\nPenalty: each $1K over budget in a quarter → lose 1 percentage point on the project.\n\nAsk one team to restate the penalty in their own words before moving on.", "kind": "bullets"}, {"index": 16, "title": "The HR budget has four movable parts", "lo": "", "ask": "", "notes": "Equation: Comp + Staffing + T&D + Admin.\n\nDollars into one lever come out of another — set up trade-off talk.", "kind": "bullets"}, {"index": 17, "title": "Architecting HR", "lo": "M3.3", "ask": "", "notes": "Organizing concept for the rest of the night (Luo et al., 2021 / PDF architecture beat).\n\nSequence: know goals + budget constraints → then design the people system.\nSim order mirrors architecture: staffing → wages/benefits → training.\n\nYou are the structural engineer of the plan; execution still matters.", "kind": "media"}, {"index": 18, "title": "LAMP framework", "lo": "M3.1", "ask": "", "notes": "Logic · Analytics · Measures · Process — Cascio et al. (2019).\n\nFitz-enz: most firms only see employment costs on the income statement; Cascio et al.: invisible unless measured.", "kind": "media"}, {"index": 19, "title": "Make operating costs visible", "lo": "M3.1", "ask": "", "notes": "Explicit instructor beat: many companies must make costs of operating visible so leaders take them seriously.\n\nMost HCROI stuff is NOT monitored or managed — that does not make it unimportant; it makes it overlooked.\n\nBridge into lean HCROI + turnover/absenteeism — no formula tourism.", "kind": "bullets"}, {"index": 20, "title": "HCROI at the start of the sim", "lo": "M3.1", "ask": "If people spend rises faster than value created, what do you cut — and what do you protect?", "notes": "BRIEF demo only — Fitz-enz sample visual. Do not grind every sub-metric.\n\nCallback: driving HCCF down without harming production — remember Delta.\n\nStudents will not rebuild the full workbook live tonight.", "kind": "visual"}, {"index": 21, "title": "Types of turnover", "lo": "M3.1", "ask": "", "notes": "Must-know frame: voluntary/involuntary · functional/dysfunctional · avoidable/unavoidable.\n\nAsk: which type hurts your sim firm most right now?", "kind": "visual"}, {"index": 22, "title": "The logic of turnover", "lo": "M3.1", "ask": "", "notes": "Cascio logic diagram: quantity × quality for acquisitions and separations.\n\nTransaction costs of processing exits/hires sit outside the value math — still real cash.", "kind": "visual"}, {"index": 23, "title": "Turnover cost components", "lo": "M3.1", "ask": "", "notes": "Four components: separation, replacement, training, performance.\n\nConnect to sim turnover worksheets / resignations.\n\nNOTE (say aloud): Chris may later share an automation tool or reports for these costs — still learn the components by hand tonight.", "kind": "media"}, {"index": 24, "title": "Practices that lower turnover", "lo": "M3.1", "ask": "", "notes": "PDF bundle only — do not invent practices.\n\nHigh wages · promotion from within · benefits · hire/promo training · quality training · participation · grievance · orientation · DEI.\n\nPunchline: bundles signal that contributions are valued.", "kind": "media"}, {"index": 25, "title": "Absenteeism cost components", "lo": "M3.1", "ask": "", "notes": "Mirror turnover structure: absentees · managing problems · substitutes · reduced quantity/quality.\n\nSim start ~1.17% — days lost / workable days.\n\nNOTE: same as turnover — automation/reports may come later; logic first.", "kind": "media"}, {"index": 26, "title": "Practices that lower absenteeism", "lo": "M3.1", "ask": "", "notes": "Cascio list from PDF: positive incentives, PTO, layoffs, market wages, training (new hire/promo/safety/quality), participation programs.\n\nFlag presenteeism risk on positive incentives — PDF callout.", "kind": "bullets"}, {"index": 27, "title": "Key financial concepts", "lo": "M3.2", "ask": "", "notes": "Placed AFTER cost visibility and BEFORE Pizza Shop / program ROI so students have vocabulary for the hurdle-rate exercise.\n\nOpportunity cost · interest/discount · NPV · IRR · break-even · cost of capital.\n\nOne breath each — no MBA finance class.", "kind": "visual"}, {"index": 28, "title": "Pizza Shop — cost of capital", "lo": "M3.2", "ask": "Would your training or pay initiative clear an 8% hurdle if benefits were honest?", "notes": "Work $500K × 8% = $40K aloud. Hurdle for people investments.\n\nAsk: would your proposed training or wage bump clear 8% if benefits were honest?\n\nThen open the ROI calculator.", "kind": "media"}, {"index": 29, "title": "Program ROI — NPV & IRR", "lo": "M3.2", "ask": "Which program clears the hurdle when cash flows are discounted?", "notes": "Short clickable label → bayoupal ROI calculator.\n\nIN-CLASS USE IDEAS:\n• Pair teams: one program claim each; plug rough cash flows; compare NPV/IRR.\n• Live demo one training vs one pay initiative against an 8% hurdle.\n• If the service is down: whiteboard the same NPV/IRR logic on paper.\n\nSERVICE NOTE: keep the BayouPal ROI calculator available for class nights; if auth/campus network blocks it, have a backup spreadsheet ready.", "kind": "bullets"}, {"index": 30, "title": "HPWPs deliver value in bundles", "lo": "M3.3", "ask": "", "notes": "Ceteris paribus HPWPs help (Wright Table 1 / intro checklist).\n\nRarely one practice — complementary bundles.\n\nDo not re-litigate full Costco vs Sam’s — intro deck already did that.", "kind": "media"}, {"index": 31, "title": "Best practice vs. best fit", "lo": "M3.3", "ask": "", "notes": "Wright HPWS as general best practice; fit = opportunistic complementary application.\n\nLuo architecture: apply practices in complementary ways under constraints.", "kind": "compare"}, {"index": 32, "title": "Strategy map — people to money", "lo": "M3.3", "ask": "", "notes": "Trace talent → process/customer → financial.\n\nIf they cannot draw arrows, they do not have a people strategy.", "kind": "visual"}, {"index": 33, "title": "A positions (not just A players)", "lo": "M3.3", "ask": "Which level (1–5) holds your A positions in the sim — and why?", "notes": "Huselid/Beatty/Becker. Ask which sim level (1–5) is their A position — no single correct answer (equifinality).\n\nPDF: sim committed to operational excellence.", "kind": "media"}, {"index": 34, "title": "Total rewards optimization", "lo": "M3.3", "ask": "", "notes": "Slade et al. (2002) Microsoft illustration from Module 3 PDF.\n\nFive attributes → four portfolios; Portfolio C often wins on net benefit.\n\nDEMO SPACE: Chris can run a student-facing total-rewards optimization later — tonight is the conceptual showcase only.", "kind": "media"}, {"index": 35, "title": "The budget is the strategy", "lo": "", "ask": "", "notes": "Show tradeoff visual. Force one aloud choice: staffing vs pay vs development vs programs.", "kind": "visual"}, {"index": 36, "title": "Utility analysis — what it is", "lo": "M3.4", "ask": "", "notes": "ΔU formula at high level. Director: wrong as soon as you finish — still useful.\n\nOpen UA app link (short label). Point: inform assumptions; do not sell implausible ROI.", "kind": "bullets"}, {"index": 37, "title": "UA example — hiring sales talent", "lo": "M3.4", "ask": "Which selection approach would you defend to a CFO — and with what assumptions?", "notes": "Callback to Intro evidence night: sales aptitude validity vs “sell me this pen.”\n\nReasonable assumptions to voice:\n• Higher r (aptitude) → larger expected utility if SDy and N are held constant.\n• Theater interviews are cheap up front and expensive in bad hires.\n• Run numbers in BayouPal UA if wifi allows — debate assumptions, not the magic $.\n\nClose M3.4 here before norms slide.", "kind": "compare"}, {"index": 38, "title": "How we talk money in this course", "lo": "", "ask": "", "notes": "Close norms: hurdle rates, protect capability (Levenson/Delta), UA informs ≠ replaces judgment.", "kind": "do_dont"}, {"index": 39, "title": "Next", "lo": "", "ask": "", "notes": "Frame: Next", "kind": "big"}]</script>
<script>
(function () {
  const slides = JSON.parse(document.getElementById("notesData").textContent);
  const slug = document.body.dataset.deckSlug;
  let channel = null;
  try { channel = new BroadcastChannel("mngt502-notes-" + slug); } catch (e) {}
  let idx = 0;

  const els = {
    toc: document.getElementById("toc"),
    label: document.getElementById("slideLabel"),
    title: document.getElementById("slideTitle"),
    lo: document.getElementById("loBadge"),
    ask: document.getElementById("askBlock"),
    notes: document.getElementById("notesBody"),
    status: document.getElementById("syncStatus"),
    follow: document.getElementById("followDeck"),
  };

  slides.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="n">SLIDE ${String(i + 1).padStart(2, "0")}</span>${s.title}`;
    b.addEventListener("click", () => show(i, true));
    els.toc.appendChild(b);
  });

  function publish(index) {
    const msg = { type: "slide", index: index, source: "notes", slug: slug };
    try { channel && channel.postMessage(msg); } catch (e) {}
    try {
      if (window.opener && !window.opener.closed) window.opener.postMessage(msg, "*");
    } catch (e) {}
  }

  function show(i, broadcast) {
    idx = Math.max(0, Math.min(i, slides.length - 1));
    const s = slides[idx];
    els.label.textContent = `Slide ${idx + 1} / ${slides.length}`;
    els.title.textContent = s.title;
    if (s.lo) {
      els.lo.hidden = false;
      els.lo.className = "lo";
      els.lo.textContent = "LO " + s.lo;
    } else {
      els.lo.hidden = true;
    }
    if (s.ask) {
      els.ask.hidden = false;
      els.ask.innerHTML = "<strong>Discuss:</strong> " + s.ask.replace(/</g, "&lt;");
    } else {
      els.ask.hidden = true;
    }
    els.notes.textContent = s.notes || "(No notes for this slide.)";
    [...els.toc.children].forEach((btn, j) => btn.classList.toggle("active", j === idx));
    history.replaceState(null, "", "#s" + (idx + 1));
    if (broadcast) {
      publish(idx);
      els.status.textContent = "Advanced from notes window";
    }
  }

  function applyRemote(data) {
    if (!data || typeof data !== "object") return;
    if (data.slug && data.slug !== slug) return;
    if (data.type !== "slide" || data.source === "notes") return;
    if (!els.follow.checked) {
      els.status.textContent = "Deck moved (follow off) — now on slide " + (data.index + 1);
      return;
    }
    if (typeof data.index === "number" && data.index !== idx) {
      show(data.index, false);
    }
    els.status.textContent = "Synced from deck · slide " + ((data.index ?? idx) + 1);
  }

  if (channel) channel.onmessage = (ev) => applyRemote(ev.data);
  window.addEventListener("message", (ev) => applyRemote(ev.data));

  document.getElementById("prevBtn").addEventListener("click", () => show(idx - 1, true));
  document.getElementById("nextBtn").addEventListener("click", () => show(idx + 1, true));
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const s = slides[idx];
    const text = `Slide ${idx + 1}: ${s.title}\n\n` +
      (s.lo ? `LO ${s.lo}\n` : "") +
      (s.ask ? `Discuss: ${s.ask}\n\n` : "\n") +
      (s.notes || "");
    try {
      await navigator.clipboard.writeText(text);
      els.status.textContent = "Copied this slide’s notes";
    } catch (e) {
      els.status.textContent = "Copy failed — select text manually";
    }
  });

  window.addEventListener("keydown", (e) => {
    if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
      e.preventDefault(); show(idx + 1, true);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); show(idx - 1, true);
    } else if (e.key === "Home") { e.preventDefault(); show(0, true); }
    else if (e.key === "End") { e.preventDefault(); show(slides.length - 1, true); }
  });

  const m = location.hash.match(/^#s(\d+)$/);
  show(m ? parseInt(m[1], 10) - 1 : 0, false);
  els.status.textContent = "Ready — open the deck and advance; notes will follow";
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: "notes-ready", source: "notes", slug: slug }, "*");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
