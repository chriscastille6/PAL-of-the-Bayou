<script type="application/json" id="notesData">[{"index": 0, "title": "Introductions, evidence, and helping", "lo": "", "ask": "", "notes": "Cold open: welcome + arc — Who I am → community → student intros → evidence warmup (calibrator → Meehl/sales → process consultation → CEBMA) → Ch1 LOs→content→BREAK → Ch2 LOs→content→BREAK.\n\nDo not rush student introductions.", "kind": "section"}, {"index": 1, "title": "Agenda", "lo": "", "ask": "", "notes": "Walk once. Order locked: Who I am → In the community → student intros → evidence warmup (calibrator → predictors/Meehl → PC → CEBMA) → Ch1 block → BREAK → Ch2 block → BREAK.\n\nClock: protect intro time; keep Who I am + community beat brief.", "kind": "bullets"}, {"index": 2, "title": "Who I am", "lo": "", "ask": "", "notes": "Style E — three minutes max. Family photo + logo strip carry the resume; keep talk sparse.\n\nLede carries the why: executives → south Louisiana policy leverage. One breath — do not make it a speech.\n\nOn slide: prior faculty (Villanova · Rutgers Business School); came to Nicholls for work–life balance, project freedom, and family (Nicholls as words only — no wordmark); I-O path (Louisiana Tech Ph.D.; LSU B.S.); one breath on 40 Under 40 · Lafourche Parish (2024) — do not tour it.\nStrip: Villanova, Rutgers Business School, Louisiana Tech, LSU, Libbey, CenturyLink, DCI, AROS nameplate.\n\nOptional after class (not on slide): brief ask-me-anything invite — do not open a CV Q&A tour now. No “seats/leverage” closer on slide.", "kind": "media"}, {"index": 3, "title": "In the community", "lo": "", "ask": "", "notes": "Style E — ninety seconds. Overview only; strip carries brands.\n\nLede: both projects are in development (italic on slide) — Bayou SHRM mentoring/networking and the EI assessment. Do not overpromise launch dates.\n\nRaymond Lee — President at Careerminds (public title). Lab thread: burnout assessment work for Careerminds/Raymond; PAL site also lists career-transition coaching assessment with Raymond Lee at Clocking Out. Do not overclaim a formal Careerminds MOU unless you want to say more aloud.\n\nBayou SHRM — mentoring & networking. Verified: Bayou SHRM Mentoring Program (PAL ongoing studies); you serve as College Relations Director (bayoushrm.org board). Mentoring connects Nicholls HR talent with local professionals; networking / practice-diffusion research sits under that umbrella — say only if asked.\n\nEmotional Intelligence Assessment — special project of interest (ability-based EI on BayouPAL / Psychological Assessments), not a named community partner. Invite curiosity; no deep dive now.\n\nClickable PAL logo + “Open EI assessment” button → https://bayoupal.nicholls.edu/platform (platform hub). Swap to the precise EI assessment-profile deep link when you have it.\n\nBridge to student intros: listen for applied project opportunities.", "kind": "bullets"}, {"index": 4, "title": "Student introductions", "lo": "", "ask": "What should Chris know about you in this course?", "notes": "They already know each other — do NOT run an icebreaker name/role go-round.\n\nCLOCK: plan ~12–18 min for substantive answers (adjust to class size).\n\nPrompt: takeaways · relationship with Chris (if wanted) · workplace opportunities · Day 1 dig-deeper. Right panel = syllabus map (M1–M9).\n\nListen for applied project opportunities you can name later. On dig-deeper: note energy and follow-up topics for later modules — do not expand those topics now.", "kind": "compare"}, {"index": 5, "title": "What is Evidence-Based Management?", "lo": "", "ask": "What would “how big is the effect?” change in a hiring debate you have had?", "notes": "Shared warmup — before Chapter 1 LOs.\n\nName it: Evidence-Based Management. Origin: medicine; medicine sets the gold standard for evidence.\n\nHero image — let it land. Borrow the attitude, not RCTs for everything.\n\nAsk for a hiring debate where effect size would change the conversation. Bridge: medicine → correlation calibrator (ibuprofen first).", "kind": "hero"}, {"index": 6, "title": "Open the correlation learning app", "lo": "", "ask": "Before you open the app: what correlation do you expect for ibuprofen and pain reduction?", "notes": "ORDER (locked):\n1) Ibuprofen ↔ pain reduction FIRST\n2) Height ↔ weight NEXT\n3) A few other INTUITIVE examples\n4) NEXT BLOCK: hiring predictors (Meehl → sales tools) — still in warmup\n\nQR or “Open correlation app” → phones. Commit a number before each reveal.\n\nCelebrate misses. If wifi dies: narrate ibuprofen r≈.14 (Meyer et al. in Intro) then height–weight as the intuitive contrast.", "kind": "media"}, {"index": 7, "title": "More intuitive calibrations", "lo": "", "ask": "", "notes": "Stay in the intuitive lane briefly — then bridge to predictors.\n\nErez & Grant examples from Intro slides: sleeping pills .30; sugar–self-control .00; alcohol–aggression .23. Optional: smoking–lung cancer small r, still consequential.\n\nBridge aloud: same r language → validity of predictors → clinical vs actuarial → sales hiring horse race.", "kind": "bullets"}, {"index": 8, "title": "When is expertise reliable?", "lo": "", "ask": "With 10 years’ experience, whose expertise is most reliable and valid?", "notes": "EARLY WARMUP (after correlation calibrations) — foreshadows Ch2 LO 2.5.\n\nIntro PDF p. 41 exercise. Vote: hospital M&A consultant vs knee surgeon vs sourdough baker (10 years each).\n\nBridge from r: same correlation language → when does seasoned judgment predict?\n\nDebrief lightly toward predictable environments + feedback → valid expertise; do not invent a scoring key the PDF does not provide.\n\nBridge to Meehl box scores.", "kind": "visual"}, {"index": 9, "title": "Meehl: clinicians vs. statistical prediction", "lo": "", "ask": "When have you trusted a seasoned gut call over a simple score?", "notes": "EARLY WARMUP — foreshadows LO 2.5 (not after Ch2 ethics).\n\nMeehl (1954) opened the clinical vs. statistical prediction debate.\n\nLeft/right: clinical = informal human combination of cues; statistical/actuarial/mechanical = explicit formula or algorithm.\n\nKey constraint: both sides use the same (or nearly same) predictor data — this is a horse race about data combination, not about who saw more information.\n\nBridge: next slide is the Grove et al. (2000) box-score meta — not in Intro PDFs.", "kind": "compare"}, {"index": 10, "title": "Box scores across prediction domains", "lo": "", "ask": "Where would you still bet on the expert over the formula?", "notes": "Grove, Zald, Lebow, Snitz, & Nelson (2000), Psychological Assessment — 136 studies; box-score cut: ES < −0.1 clinician, −0.1 to 0.1 tie, > 0.1 mechanical.\n\nTally (main definition): formula notably better 63 (47%); roughly equal 65 (~48%); clinician notably better 8 (6%). Average: mechanical ~10% more accurate.\n\nDomains (Grove Table 2 types + discussion — not a per-domain win table in our slides): Educational · Financial · Forensic · Medical · Clinical–Personality · Other. Holds in general medicine, mental health, personality, education/training.\n\nExample predictands from the meta corpus (illustrative, not win counts): college/grad success, psychiatric diagnosis, job performance, managerial success, medical diagnoses, forensic/recidivism-style criteria.\n\nGap to name aloud: Managing Human Capital Intro.pdf and Introduction to HR Analytics.pdf do not contain a Meehl/Grove table — numbers here are from the published meta.\n\nLanding → sales hiring: unstructured expertise vs structured predictors.", "kind": "effects"}, {"index": 11, "title": "Hire a sales professional", "lo": "", "ask": "Which tool would you bet on — before you see the evidence?", "notes": "Intro PDF p. 25 visual. Four tools — vote before charts.", "kind": "visual"}, {"index": 12, "title": "Four tools on the table", "lo": "", "ask": "", "notes": "Detail the four screens + meta evidence quality slide (120+ samples; N≈16,230).", "kind": "media"}, {"index": 13, "title": "What HR professionals prefer", "lo": "", "ask": "Is preference good evidence of what predicts sales performance?", "notes": "Highhouse (2008) preference chart — unstructured interview wins popularity.\n\nAsk: is preference good evidence? What would better evidence look like?", "kind": "media"}, {"index": 14, "title": "What actually predicts sales effectiveness", "lo": "", "ask": "", "notes": "Validity chart: sales aptitude ≈ .45 > GMA ≈ .40 > personality ≈ .28 > unstructured interview ≈ .20.\n\nCite Vinchur et al. (1998) as the sales meta; Highhouse (2008) for framing (PDF chart titles say Highhouse).\n\nPunchline: aptitude beats the interview.", "kind": "media"}, {"index": 15, "title": "“Sell me this pen”", "lo": "", "ask": "Is a clever pitch the same as a validated sales predictor?", "notes": "Educational cue — not a film still (copyright).\n\nWolf of Wall Street meme energy — clever pitch ≠ validated predictor.", "kind": "media"}, {"index": 16, "title": "Ambiverts and sales", "lo": "", "ask": "Who outperforms — the loudest closer or the balanced talker–listener?", "notes": "Grant (2013) Fig 1 inverted-U. Ambivert band 3.75–5.50 descriptive $/hr & revenue.\n\nCastille plug sparse: Castille & Castille (2019); Simonet & Castille (2020).", "kind": "media"}, {"index": 17, "title": "My philosophy", "lo": "", "ask": "", "notes": "Bridge from sales/Meehl demo to how Chris teaches — still in early warmup.\n\nSparse: acquire & use evidence; weigh vs experience; attitude of wisdom.\n\nNext slide is the big quote — then process consultation contract.", "kind": "bullets"}, {"index": 18, "title": "Attitude of wisdom", "lo": "", "ask": "", "notes": "Pfeffer & Sutton (2006), Hard Facts… — not Pfeffer alone.\n\nRead once. Pause. Bridge to process consultation (how we work together).", "kind": "big"}, {"index": 19, "title": "How I work with you (process consultation)", "lo": "", "ask": "", "notes": "EARLY CONTRACT — right after Meehl/sales / attitude of wisdom.\n\nSparse PC opener: you share models/evidence; they decide relevance and whether they want help implementing.\n\nSchein capacity-building, not rescue. No consulting pitch.\n\nNext: fuller Schein sequence (three models → joint diagnosis → humble inquiry → sandbox → in this room), then CEBMA ladder.", "kind": "big"}, {"index": 20, "title": "Three models of helping", "lo": "", "ask": "Which model did your last consultant (or boss) actually use?", "notes": "EARLY PC block. Expert / doctor–patient / process consultation.\n\nLand: Chris practices PC — capacity building, not pre-packaged answers.\n\nKeep sparse; do not reopen a CV tour.", "kind": "visual"}, {"index": 21, "title": "The helping relationship (Schein, 1988, 2009)", "lo": "", "ask": "", "notes": "Frame: The helping relationship (Schein, 1988, 2009)", "kind": "big"}, {"index": 22, "title": "Joint diagnosis, not the medical model", "lo": "", "ask": "", "notes": "Co-create understanding with evidence — then they act.\n\nContrast medical model (expert diagnoses for them) vs joint diagnosis.", "kind": "visual"}, {"index": 23, "title": "Test of a good diagnosis — Schein (1988)", "lo": "", "ask": "", "notes": "Read once, then wait 5 seconds. Ask who disagrees.", "kind": "quote"}, {"index": 24, "title": "Humble inquiry over clever telling", "lo": "", "ask": "What question would you ask before offering a solution?", "notes": "Ask what you do not already know; resistance as data; earn the right to tell.\n\nBridge to sandbox as where they will practice the relationship.", "kind": "media"}, {"index": 25, "title": "The simulation is our sandbox", "lo": "", "ask": "", "notes": "EARLY PC block — three cards:\n1) Try the relationship on sim decisions (Schein).\n2) Learn in a toy world — educational stakes.\n3) You own the problem — humble inquiry; they keep judgment.\n\nPreview later sim session without derailing; next is In this room → CEBMA.", "kind": "sandbox"}, {"index": 26, "title": "In this room", "lo": "", "ask": "", "notes": "Do / Don’t norms. Invite one norm they want from you this term.\n\nNext: Evidence varies in quality (CEBMA ladder), then Chapter 1 LOs.", "kind": "do_dont"}, {"index": 27, "title": "Evidence varies in quality", "lo": "", "ask": "Where would you place that sales validity meta — it is not of RCTs?", "notes": "AFTER process consultation contract — back to evidence quality.\n\nBoiled-down CEBMA-inspired ladder ONLY — full CEBMA guide was cut.\n\nNUANCE: meta-analysis is the top rung only when it is of RCTs. A meta of correlational studies is not automatically “AA.”\n\nPoint at the sales validity meta they just saw — where does it sit? Usually below RCT rungs.\n\nNext: Chapter 1 learning objectives (1.1–1.4 only).", "kind": "bullets"}, {"index": 28, "title": "Chapter 1 learning objectives", "lo": "", "ask": "", "notes": "ONE slide — Chapter 1 only (1.1–1.4), in order. No exam-framing lede.\n\nRead once; do not discuss every LO now — content slides follow.\n\nOptional discuss prompt (not on slide): pick 1.1 or 1.2.", "kind": "objectives"}, {"index": 29, "title": "What is human resource management?", "lo": "1.1", "ask": "", "notes": "LO 1.1. Sparse definition from Bauer / Intro deck.\n\nLand: decisions about people → org effectiveness; questions, not paperwork alone.", "kind": "bullets"}, {"index": 30, "title": "Characteristics of effective HRM decisions", "lo": "1.1", "ask": "", "notes": "Bauer Fig 1.7 — large visual. Walk the five spokes: evidence-informed, relationships, time/cost, legal-ethical-fair, stakeholder perspective.\n\nBridge into bias / four sources.", "kind": "visual"}, {"index": 31, "title": "Bias makes questions (and evidence) necessary", "lo": "1.1", "ask": "Which bias shows up most often in your workplace decisions?", "notes": "LO 1.1 continued. ~50% of org decisions considered successful.\n\nName biases lightly; Oeberst & Imhoff belief-consistent processing if useful.\n\nBridge to four sources of evidence.", "kind": "bullets"}, {"index": 32, "title": "Four sources of evidence", "lo": "1.1", "ask": "", "notes": "Barends & Rousseau visual (Intro PDF). Scientific · org · stakeholder · expertise.\n\nName the 6As lightly if time.", "kind": "media"}, {"index": 33, "title": "Why HRM matters", "lo": "1.2", "ask": "", "notes": "LO 1.2. Schneider ASA + human capital.\n\nCulture deep-dive is next (Fig 1.2).", "kind": "bullets"}, {"index": 34, "title": "Types of organizational culture", "lo": "1.2", "ask": "", "notes": "Bauer Fig 1.2 Competing Values — clan / adhocracy / market / hierarchy.\n\nKeep short; discussion exercise is the next slide.", "kind": "media"}, {"index": 35, "title": "Diagnose your firm’s culture", "lo": "1.2", "ask": "Which type most accurately describes your organization — and why?", "notes": "Discussion: diagnose their company using Figure 1.2 value statements only (cohesive/empowering; entrepreneurial/creative; structured/efficient; aggressive/results-oriented).\n\nDo not invent OCAI Likert items — stick to textbook descriptors.\n\nQuick pair-share; land on “HR practices reinforce culture.”", "kind": "bullets"}, {"index": 36, "title": "An aging nation — demographic pressure", "lo": "1.3", "ask": "What does aging look like in your south Louisiana / Acadiana talent pipeline?", "notes": "Bauer Fig 1.4 — U.S. % 65+ 2012 vs 2050 (Census projections / Ortman et al.).\n\nVerified from figure: total 13.7% in 2012; sharp rise by 2050 (e.g., White alone 15.2→22.9; NH White 17.3→27.4).\n\nTease the ask — then advance to the parish ACS companion slide (Lafayette / Lafourche / Terrebonne).\n\nHR implications: aging exits, diversity of labor force, pipeline planning.", "kind": "media"}, {"index": 37, "title": "South Louisiana today — % aged 65+", "lo": "1.3", "ask": "Is your parish younger or older than the U.S. baseline — and what does that mean for exits?", "notes": "Companion to Fig 1.4 — today’s parish age structure, not 2050 projections.\n\nACS 2020–2024 5-year (Table B01001 via Census Reporter; api.census.gov needs a key / census.gov often Cloudflare-blocked in this build env):\n• U.S. 17.2% · Louisiana 16.7%\n• Lafayette Parish 14.7% (younger)\n• Lafourche 16.6% · Terrebonne 15.8%\n\nBe explicit: these are parish estimates — not a Census ‘Acadiana’ region.\n\nSame vintage context (do not invent):\n• Lafayette LFPR 16+ 65.4%; White NH 61.7% · Black NH 25.4% · Hispanic 6.7%\n• Lafourche LFPR 56.8%; White NH 74.2% · Black NH 12.8% · AIAN NH 2.3%\n• Terrebonne LFPR 58.9%; White NH 63.8% · Black NH 18.3% · AIAN NH 4.5%\n\nLand: national aging narrative + local pipeline numbers students can argue with.", "kind": "media"}, {"index": 38, "title": "The changing context of HRM", "lo": "1.3", "ask": "", "notes": "Compressed LO 1.3 after demographics visual.\n\nPunchline: automate transactional HR → operate more strategically.", "kind": "bullets"}, {"index": 39, "title": "Kinds of HR professionals", "lo": "1.4", "ask": "", "notes": "Bauer Fig 1.5 job titles + PDF career language: manager/specialist/partner/generalist.\n\nHRBP = consultant aligning to business objectives.\n\nUlrich four-role model is Ch2 (Fig 2.3) — do not preview it here.", "kind": "media"}, {"index": 40, "title": "SHRM Body of Applied Skills and Knowledge", "lo": "1.4", "ask": "", "notes": "Bauer Fig 1.6 (2e Intro PDF p. 73) — SHRM BASK honeycomb.\n\nNote: older 1e pack Figure_01_06 is a different SHRM wheel; we use the 2e BASK asset.\n\nLand competencies → BREAK.", "kind": "visual"}, {"index": 41, "title": "BREAK", "lo": "", "ask": "", "notes": "Hard stop. Invite stretch, bathroom, and parking-lot questions.\n\nClock: 5–10 minutes.\n\nAfter the Chapter 1 break: open with Chapter 2 learning objectives (2.1–2.6; strategy framed lightly, then analytics/ethics).\nAfter the Chapter 2 break: hand off verbally to the simulation session.", "kind": "section"}, {"index": 42, "title": "Chapter 2 learning objectives", "lo": "", "ask": "", "notes": "ONE compact slide — Bauer Ch2 LOs 2.1–2.6 in order (matches Intro PDF spot check).\n\nStrategy (2.1–2.3) is framing + Costco visuals tonight — full strategy lecture stays in Module 3 / 04_strategy.\n\nOptional discuss prompt (not on slide): 2.3 Costco fit or 2.5 Rest.", "kind": "objectives"}, {"index": 43, "title": "Costco vs Sam’s Club", "lo": "2.3", "ask": "Same industry — why would two bulk retailers need different people systems?", "notes": "Intro PDF p. 91 logos. Best fit opener — same industry, different people systems.\n\nDo not lecture full strategy here; land “bundle must fit strategy.”", "kind": "visual"}, {"index": 44, "title": "Different HR bundles — efficiency metrics", "lo": "2.3", "ask": "Higher wages and benefits — how can Costco still win on profit per employee?", "notes": "Intro PDF p. 92 Cascio HBR table (PDF spells “Casico” — cite Cascio).\n\nWalk profit/employee, wages, health care, turnover. Ask how Costco can pay more and still win on profit per employee.\n\nBridge to Ployhart psychology of competitive advantage.", "kind": "visual"}, {"index": 45, "title": "Why Costco is so loved", "lo": "2.3", "ask": "", "notes": "Intro PDF p. 93 Economist visual — customers, employees, investors.\n\nOne breath; then VRIO (Barney & Wright) → Ployhart selection ladder.", "kind": "visual"}, {"index": 46, "title": "The VRIO framework", "lo": "2.3", "ask": "Which VRIO link is weakest in your firm’s people systems?", "notes": "Intro PDF p. 90 / Barney & Wright (1998) Figure 1.\n\nWalk the four tests in order (PDF labels):\nV · Value (Valuable?)\nR · Rare (Rare?)\nI · Imitability (Difficult to imitate?)\nO · Organization (Supported by organization — organized to capture value).\n\nLand the ladder: disadvantage → parity → temporary → sustained.\n\nBridge next: Ployhart applies this resource logic to selection systems.", "kind": "media"}, {"index": 47, "title": "Selection systems & competitive advantage", "lo": "2.3", "ask": "Where does your staffing system sit — disadvantage, parity, or advantage?", "notes": "Intro PDF p. 99 — Ployhart (2012) staffing ladder (full sustainable column).\n\nPunchline from PDF: more-valid selection that creates more valuable forms of human capital AND innovative ways of conducting business → sustainable competitive advantage.\n\nHuman-capital row on slide: Valuable → Valuable, Rare → Valuable, Rare, Inimitable, Non-substitutable.\n\nTie back to Costco (bundle fit) and forward to sales/validity demos (invalid / unstructured → disadvantage).\n\nDo not rebuild Module 3 strategy lecture.", "kind": "visual"}, {"index": 48, "title": "Three decision errors managers make", "lo": "2.3", "ask": "Which error shows up most in people decisions where you work?", "notes": "Instructor framing for management students (not labeled Type I–III in Intro PDF).\n\nType I: think helpful when it isn’t.\nType II: think not helpful when it is.\nType III: reverse / sign error — helpful when harmful, or harmful when helpful.\n\nOptional examples (not on slide):\n• Mandatory RTO as Type I if you assume office return lifts productivity when evidence/context says otherwise.\n• Unstructured interview as Type I if you treat “gut chemistry” as a strong predictor when validity is weak — or Type II if you dismiss a structured tool that actually predicts.\n\nSkip classic false-positive / false-negative jargon unless a student asks.\n\nLand hard into next slide: apply Type II / Type III to HPWS/HPWPs.", "kind": "sandbox"}, {"index": 49, "title": "Universal best practices (HPWPs)", "lo": "2.3", "ask": "Which of these practices does your firm already use — and which are missing?", "notes": "Apply the decision-error lens immediately.\n\nEvidence claim (Intro PDF cites Jiang et al., 2012 meta): decades of work — HPWS/HPWPs help companies improve HRM / organizational outcomes.\n\nOn slide: best practice vs best fit (Costco vs Sam’s); ceteris paribus; denying influence = Type II; inferring “not helpful at all” = Type III (instructor “type error” → Type III / reverse-absolute wrong).\n\nIndustry moderation — NOT in Intro PDF/Bauer. If you say it aloud, cite Combs et al. (2006) Personnel Psychology: HPWP–performance link stronger in manufacturing than service; overall still positive. Do not attribute that moderator to the textbook.\n\nDiscuss: which practices does your firm use? Which are missing?\n\nNext slide = full Wright (2008) Table 1 checklist from Intro PDF p. 129.", "kind": "bullets"}, {"index": 50, "title": "HPWP checklist", "lo": "2.3", "ask": "Scan the list — which practices are present, thin, or missing where you work?", "notes": "Large visual: Wright (2008) Table 1 questionnaire (Intro PDF p. 129).\n\nWalk 2–3 items aloud; do not read all 13. Invite scan for gaps.\n\nNote: classic Pfeffer lists vary by source — this is the checklist as presented in Chris’s Intro PDF / course HPWS slide.\n\nOptional one-breath recall: ignoring this toolkit wholesale ≈ Type II.", "kind": "visual"}, {"index": 51, "title": "HPWPs as reinforcing bundles", "lo": "2.3", "ask": "Where is your firm strong in one column but thin in another?", "notes": "Intro PDF p. 133 AMO bundles — empowerment / motivation / skill.\n\nPunchline: mutually reinforcing system, not one fad.\n\nOptional: ask which column is strongest where they work.", "kind": "effects"}, {"index": 52, "title": "Open systems perspective", "lo": "2.3", "ask": "When performance fails, what else in the system might you check?", "notes": "Intro PDF p. 131 systems thinking — pieces fit; synergy; integrated systems outperform individual fixes.\n\nInstructor point: when someone makes a mistake, see it as part of a broader system — easy to blame one person’s performance when team dysfunctions or cultural issues are at play.\n\nAsk on slide: When performance fails, what else in the system might you check?\n\nNo Bauer open-systems figure in the Intro PDF — Style E SVG (inputs → throughputs → outputs + feedback).", "kind": "visual"}, {"index": 53, "title": "Steps for strategy formulation", "lo": "2.1", "ask": "When have you seen a strategy poster with no follow-through on people priorities?", "notes": "LO 2.1 — Bauer Fig 2.1 large (staircase): mission/vision/values → environments → strategy type → stakeholder objectives → finalize.\n\nOne breath on the five steps; do not rebuild full Module 3 strategy lecture.\n\nBridge: formulation sets the map; implementation + which HRM activities to prioritize come next — practice that prioritization in the simulation.\n\nPoint forward to Module 3 / 04_strategy for depth.", "kind": "visual"}, {"index": 54, "title": "Automation: transactional → transformational", "lo": "2.2", "ask": "What transactional HR work in your org could AI or automation free up?", "notes": "Bauer Fig 2.2 large. Automation/AI frees transactional time for transformational HR.\n\nAsk what in their org is still stuck in transactional mode.", "kind": "visual"}, {"index": 55, "title": "Balanced scorecard", "lo": "2.3", "ask": "Which scorecard quadrant will your sim decisions hit first?", "notes": "Bauer Fig 2.4 large — four perspectives around strategy.\n\nExplicit sim hook: scorecard logic shows up in simulation decisions/reporting.\n\nDo not run a full Kaplan–Norton lecture.", "kind": "visual"}, {"index": 56, "title": "Ulrich’s model of strategic HRM", "lo": "2.2", "ask": "", "notes": "Bauer Fig 2.3 (Ulrich, 1996). Four roles — mature HR org, not one unicorn.\n\nSparse commentary: hard for one person to do all four well. Move on.", "kind": "visual"}, {"index": 57, "title": "Analytical maturity", "lo": "2.4", "ask": "Where does your organization mostly live today — dashboard or prescription?", "notes": "LO 2.4 — LARGE Cascio maturity visual (Intro PDF p. 145).\n\nStages as labeled: Level 1 Operational Reporting (56%) · Level 2 Advanced Reporting (30%) · Level 3 Predictive (10%) · Level 4 Prescriptive (4%). Levels 1–2 = descriptive; automate.\n\nNext: four kinds of analytics + WFH bridge, then unicorn competencies.", "kind": "visual"}, {"index": 58, "title": "Four kinds of analytics", "lo": "2.4", "ask": "For a WFH policy, which question are you actually asking?", "notes": "Bauer p. 141: descriptive snapshot · predictive future · prescriptive actions. Fourth tile Strategic = competitive positioning lens (instructor framing; not a separate Cascio rung).\n\nWFH examples on tiles. Next slide reprises Policy→Mediator→Outcomes.", "kind": "tiles"}, {"index": 59, "title": "Same WFH case — four analytics questions", "lo": "2.4", "ask": "", "notes": "Tiny logic-model reprise — full WFH walk-through is in simulation deck.\n\nOne breath: same remote policy case asked at four depths.", "kind": "visual"}, {"index": 60, "title": "Don’t expect a unicorn", "lo": "2.4", "ask": "Who on your team covers which competency today?", "notes": "Intro PDF p. 140 unicorn framing for Bauer Table 2.2.\n\nUnicorn = rare combo of all seven competencies in one person — build a team, not a mythical hire.\n\nAI accelerates many competencies / lowers the floor for speed; does not replace judgment, law, or ethics.\n\nNext slide: the seven competency names (Table 2.2).", "kind": "media"}, {"index": 61, "title": "Seven competencies of HR analytics", "lo": "2.4", "ask": "Which competency is your team’s bottleneck — and where does AI help first?", "notes": "Bauer Table 2.2 — Seven Competencies of Effective HR Analytics Teams.\n\nList on slide (and in the table figure):\n1. Theory\n2. Business\n3. Data management\n4. Measurement\n5. Data analysis\n6. Employment law\n7. Ethics\n\nAsk: which is the bottleneck — and where does AI help first?\nLand: team mix, not one hire; law + ethics stay human.", "kind": "media"}, {"index": 62, "title": "HR as a science — the scientific process", "lo": "2.5", "ask": "Where do people problems usually stall — problem ID, hypothesis, or communication?", "notes": "Bauer Fig 2.6 large. HR analytics = science: identify problem → communicate → loop.\n\nIntro PDF Step 3 example (say if useful): “I believe flexible work harms productivity, so if we pull people back (RTO), productivity should rise.”\n\nRecall earlier Type I / II / III lens — a bad hypothesis is often a decision error. Then Rest (ethics). Meehl/sales already ran in the early evidence warmup — callback only.", "kind": "visual"}, {"index": 63, "title": "Rest’s ethical decision making model", "lo": "2.5", "ask": "Which step do leaders skip most often under cost pressure?", "notes": "Teaching point (on slide): any case that we work through could be viewed from an ethics perspective — Rest’s four components are the AOL lens for that reading, not a one-off ethics lecture.\n\nIntro PDF AOL: moral awareness · reasoning · intent · behavior (Rest et al., 1999 — course citation).\n\nMatch PDF terms (not the older sensitivity/judgment/motivation/character labels unless a student asks — then map synonyms briefly).\n\nEveryone assessed on these four parts this term.\n\nBridge: earlier Type I–III = wrong beliefs about helpfulness; Rest = ethical quality of the choice once you see the issue.", "kind": "visual"}, {"index": 64, "title": "Half of organizational decisions fail", "lo": "2.5", "ask": "Where have you seen a rushed people decision fail?", "notes": "Nutt (1999) AOM Perspectives — ~50% of org decisions fail.\n\nCALLBACK only: expertise / Meehl / sales already ran in the early warmup.\n\nSame citation as strategy deck knowing–doing gap slide.", "kind": "bullets"}, {"index": 65, "title": "A successful analytics function", "lo": "2.6", "ask": "", "notes": "LO 2.6 thin card — embed, competencies, change management, ethics.\n\nDo not fake a full analytics-org design lecture; land the stance, then BREAK. PC contract already ran in the early warmup.", "kind": "bullets"}, {"index": 66, "title": "BREAK", "lo": "", "ask": "", "notes": "Hard stop. Invite stretch, bathroom, and parking-lot questions.\n\nClock: 5–10 minutes.\n\nAfter the Chapter 1 break: open with Chapter 2 learning objectives (2.1–2.6; strategy framed lightly, then analytics/ethics).\nAfter the Chapter 2 break: hand off verbally to the simulation session.", "kind": "section"}]</script>
<script>
(function () {
  const slides = JSON.parse(document.getElementById("notesData").textContent);
  const slug = document.body.dataset.deckSlug;
  let channel = null;
  try { channel = new BroadcastChannel("mngt502-notes-" + slug); } catch (e) {}
  let idx = 0;

  const els = {
    toc: document.getElementById("toc"),
    label: document.getElementById("slideLabel"),
    title: document.getElementById("slideTitle"),
    lo: document.getElementById("loBadge"),
    ask: document.getElementById("askBlock"),
    notes: document.getElementById("notesBody"),
    status: document.getElementById("syncStatus"),
    follow: document.getElementById("followDeck"),
  };

  slides.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="n">SLIDE ${String(i + 1).padStart(2, "0")}</span>${s.title}`;
    b.addEventListener("click", () => show(i, true));
    els.toc.appendChild(b);
  });

  function publish(index) {
    const msg = { type: "slide", index: index, source: "notes", slug: slug };
    try { channel && channel.postMessage(msg); } catch (e) {}
    try {
      if (window.opener && !window.opener.closed) window.opener.postMessage(msg, "*");
    } catch (e) {}
  }

  function show(i, broadcast) {
    idx = Math.max(0, Math.min(i, slides.length - 1));
    const s = slides[idx];
    els.label.textContent = `Slide ${idx + 1} / ${slides.length}`;
    els.title.textContent = s.title;
    if (s.lo) {
      els.lo.hidden = false;
      els.lo.className = "lo";
      els.lo.textContent = "LO " + s.lo;
    } else {
      els.lo.hidden = true;
    }
    if (s.ask) {
      els.ask.hidden = false;
      els.ask.innerHTML = "<strong>Discuss:</strong> " + s.ask.replace(/</g, "&lt;");
    } else {
      els.ask.hidden = true;
    }
    els.notes.textContent = s.notes || "(No notes for this slide.)";
    [...els.toc.children].forEach((btn, j) => btn.classList.toggle("active", j === idx));
    history.replaceState(null, "", "#s" + (idx + 1));
    if (broadcast) {
      publish(idx);
      els.status.textContent = "Advanced from notes window";
    }
  }

  function applyRemote(data) {
    if (!data || typeof data !== "object") return;
    if (data.slug && data.slug !== slug) return;
    if (data.type !== "slide" || data.source === "notes") return;
    if (!els.follow.checked) {
      els.status.textContent = "Deck moved (follow off) — now on slide " + (data.index + 1);
      return;
    }
    if (typeof data.index === "number" && data.index !== idx) {
      show(data.index, false);
    }
    els.status.textContent = "Synced from deck · slide " + ((data.index ?? idx) + 1);
  }

  if (channel) channel.onmessage = (ev) => applyRemote(ev.data);
  window.addEventListener("message", (ev) => applyRemote(ev.data));

  document.getElementById("prevBtn").addEventListener("click", () => show(idx - 1, true));
  document.getElementById("nextBtn").addEventListener("click", () => show(idx + 1, true));
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const s = slides[idx];
    const text = `Slide ${idx + 1}: ${s.title}\n\n` +
      (s.lo ? `LO ${s.lo}\n` : "") +
      (s.ask ? `Discuss: ${s.ask}\n\n` : "\n") +
      (s.notes || "");
    try {
      await navigator.clipboard.writeText(text);
      els.status.textContent = "Copied this slide’s notes";
    } catch (e) {
      els.status.textContent = "Copy failed — select text manually";
    }
  });

  window.addEventListener("keydown", (e) => {
    if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
      e.preventDefault(); show(idx + 1, true);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); show(idx - 1, true);
    } else if (e.key === "Home") { e.preventDefault(); show(0, true); }
    else if (e.key === "End") { e.preventDefault(); show(slides.length - 1, true); }
  });

  const m = location.hash.match(/^#s(\d+)$/);
  show(m ? parseInt(m[1], 10) - 1 : 0, false);
  els.status.textContent = "Ready — open the deck and advance; notes will follow";
  try {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({ type: "notes-ready", source: "notes", slug: slug }, "*");
    }
  } catch (e) {}
})();
</script>
</body>
</html>
