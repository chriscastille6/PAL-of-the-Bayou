name: Deploy Correlation Calibrator (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "correlation_learning_app/web/**"
      - "docs/correlation-calibrator/**"
      - "static/mngt-502/**"
      - ".github/workflows/deploy-correlation-calibrator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-correlation-calibrator
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static site
        run: |
          mkdir -p _site/correlation-calibrator/assets
          cp correlation_learning_app/web/index.html \
             correlation_learning_app/web/app.js \
             correlation_learning_app/web/data.js \
             correlation_learning_app/web/styles.css \
             _site/correlation-calibrator/
          cp correlation_learning_app/web/assets/lab-emblem-circle.png \
             _site/correlation-calibrator/assets/

          # MNGT 502 intro deck (Style E) — relative ../assets paths must stay intact
          mkdir -p _site/mngt-502
          cp -R static/mngt-502/. _site/mngt-502/

          printf '%s\n' \
            '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>' \
            '<title>PAL static apps</title></head><body>' \
            '<h1>PAL static apps</h1>' \
            '<ul>' \
            '<li><a href="./correlation-calibrator/">Correlation Calibrator</a></li>' \
            '<li><a href="./mngt-502/">MNGT 502 slides hub</a></li>' \
            '<li><a href="./mngt-502/decks/01_intro_evidence_pc.html">MNGT 502 · 1 Intro · Evidence · PC</a></li>' \
            '<li><a href="./mngt-502/decks/03_simulation.html">MNGT 502 · 2 Simulation</a></li>' \
            '<li><a href="./mngt-502/decks/04_strategy.html">MNGT 502 · 3 HR Strategy &amp; Costing</a></li>' \
            '<li><a href="./mngt-502/decks/05_hris_eeo.html">MNGT 502 · 4 HRIS · DEI &amp; EEO</a></li>' \
            '</ul>' \
            '</body></html>' > _site/index.html
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
